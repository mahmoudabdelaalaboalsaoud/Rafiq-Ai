<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفيق | مساعد السيارات المصري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D10; --panel:#12151A; --panel-2:#181C22; --line:#262B33;
    --fog:#8B93A1; --paper:#EDEEF0; --signal:#3DDBD9; --signal-dim:#173F3E;
    --alert:#E8A33D; --alert-dim:#3A2E15; --danger:#E85D4D; --danger-dim:#3A1E1A; --good:#4ADE80; --good-dim:#123322;
    --tier-excellent:#4ADE80; --tier-fair:#3DDBD9; --tier-attention:#E85D4D; --tier-unknown:#8B93A1;
    --display:'Cairo',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 30% 0%, #0F2827 0%, var(--ink) 55%);
    color:var(--paper); font-family:var(--display); display:flex; flex-direction:column; overflow:hidden;
  }
  ::selection{background:var(--signal); color:var(--ink);}
  :focus-visible{outline:2px solid var(--signal); outline-offset:2px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 4vw; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:900; font-size:1.05rem;}
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--signal); box-shadow:0 0 10px var(--signal); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .brand small{display:block; font-family:var(--mono); font-size:.62rem; color:var(--fog); font-weight:400; letter-spacing:.5px; margin-top:2px;}
  .clear-btn{
    background:none; border:1px solid var(--line); color:var(--fog); font-family:var(--mono); font-size:.68rem;
    padding:8px 14px; border-radius:20px; cursor:pointer; transition:.2s;
  }
  .clear-btn:hover{border-color:var(--fog); color:var(--paper);}
  .admin-header-login-btn{display:inline-flex; align-items:center; gap:6px;}

  main{
    flex:1; overflow-y:auto; display:flex; justify-content:center; padding:28px 4vw 12px;
  }
  .thread{width:100%; max-width:760px; display:flex; flex-direction:column; gap:18px;}

  .intro{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 0 18px; text-align:center;}
  .intro h1{
    font-family:var(--display); font-size:clamp(1.4rem,4.3vw,2.4rem); font-weight:900;
    letter-spacing:.5px; line-height:1.5; margin-bottom:10px;
    background:linear-gradient(90deg, var(--paper), var(--signal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .msg-row{display:flex; gap:12px; max-width:100%;}
  .msg-row.user{flex-direction:row-reverse;}
  .avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:.85rem; font-weight:800;
  }
  .avatar.bot{background:var(--signal-dim); color:var(--signal); border:1px solid var(--signal);}
  .avatar.user{background:var(--panel-2); color:var(--fog); border:1px solid var(--line);}
  .bubble{
    /* لو ظهرت كلمة إنجليزية طويلة متصلة (زي جزء من رابط أو اسم موديل)، overflow-wrap بيمنعها إنها
       تكسر عرض الفقاعة وتعمل سكرول أفقي على شاشة موبايل ضيقة */
    max-width:82%; padding:13px 17px; border-radius:12px; font-size:.92rem; line-height:1.85; white-space:pre-wrap; overflow-wrap:break-word;
  }
  .msg-row.bot .bubble{background:var(--panel); border:1px solid var(--line); border-radius:12px 12px 12px 3px;}
  .msg-row.user .bubble{background:var(--signal-dim); color:#E9FFFE; border-radius:12px 12px 3px 12px;}
  .bubble.typing{font-family:var(--mono); font-size:.75rem; color:var(--fog);}
  .bubble .result-card{
    /* لازم نصفّر white-space هنا، لأنه لو فضل موروث pre-wrap من .bubble، أي مسافة أو سطر فاضي
       في كود الـ innerHTML (حتى لو مجرد تنسيق/إزاحة) بيتحول لفراغ فعلي ظاهر في الشاشة —
       وده بالظبط اللي كان بيعمل الفراغات الرهيبة بين صفوف الحالة/الكيلومترات/السعر */
    margin-top:10px; background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; white-space:normal;
    display:flex; flex-direction:column; gap:10px;
  }
  .bubble .result-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:.82rem; padding:5px 2px; border-bottom:1px dashed var(--line);}
  .bubble .result-row:last-child{border-bottom:none;}
  .bubble .result-row b{color:var(--signal);}
  /* بند "النطاق" — أول حاجة تتعرض في الكارت، إحصائيتين (سعر وعدادات) جنب بعض عشان ياخدهم المستخدم
     بنظرة واحدة قبل ما ينزل لتفاصيل كل إعلان لوحده */
  .range-hero{
    display:flex; gap:10px; padding:14px 16px;
    background:linear-gradient(135deg, var(--signal-dim), rgba(23,63,62,.35));
    border:1px solid rgba(61,219,217,.35); border-radius:9px;
  }
  .range-stat{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0;}
  .range-stat + .range-stat{border-inline-start:1px solid rgba(61,219,217,.25); padding-inline-start:10px;}
  .range-label{font-family:var(--mono); font-size:.66rem; color:var(--signal); letter-spacing:.2px; line-height:1.4;}
  .range-value{font-family:var(--display); font-size:1.15rem; font-weight:800; color:var(--paper); direction:ltr; unicode-bidi:plaintext;}

  /* صف "headline" هو أهم رقم في رد تاني (زي "السعر المقترح" في التوصية) — لازم يبان كـ"إحصائية"
     مستقلة ومميزة عن باقي الصفوف الجدولية العادية، مش مجرد سطر تاني في نفس الطابور */
  .bubble .result-row.headline{
    flex-direction:column; align-items:flex-start; gap:4px; padding:14px 16px; margin:0;
    background:linear-gradient(135deg, var(--signal-dim), rgba(23,63,62,.35));
    border:1px solid rgba(61,219,217,.35); border-bottom:1px solid rgba(61,219,217,.35); border-radius:9px;
  }
  .bubble .result-row.headline span{font-family:var(--mono); font-size:.72rem; color:var(--signal); letter-spacing:.2px;}
  .bubble .result-row.headline b{font-family:var(--display); font-size:1.5rem; font-weight:800; color:var(--paper); direction:ltr; unicode-bidi:plaintext;}

  /* كارت إعلان فردي — كل إعلان حقيقي بقى كارت مستقل بحده الخاص وبرابط مصدره تحته، بدل ما يتجمع
     مع إعلانات تانية في مجموعة واحدة وتضيع تفاصيله الفردية */
  .group-block, .listing-block{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    border-inline-start:4px solid var(--tier-unknown);
  }
  .group-block.tier-excellent, .listing-block.tier-excellent{border-inline-start-color:var(--tier-excellent);}
  .group-block.tier-fair, .listing-block.tier-fair{border-inline-start-color:var(--tier-fair);}
  .group-block.tier-attention, .listing-block.tier-attention{border-inline-start-color:var(--tier-attention);}
  .group-block.tier-unknown, .listing-block.tier-unknown{border-inline-start-color:var(--tier-unknown);}
  .group-block.is-cheapest, .listing-block.is-cheapest{background:linear-gradient(180deg, rgba(61,219,217,.07), var(--panel-2) 55%);}
  /* عنوان الإعلان فوق كل كارت (الماركة + الموديل + السنة + الفئة لو مذكورة) — بيعرّف الإعلان
     قبل ما توصل لتفاصيله، مفيد خصوصًا لما الكارت بيبقى جوه رد فيه أكتر من موديل أو مقارنة */
  .listing-title{
    font-family:var(--mono); font-weight:600; font-size:.72rem; color:var(--fog);
    letter-spacing:.2px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px dashed var(--line);
  }
  .group-title{
    font-family:var(--display); font-weight:700; font-size:.86rem; color:var(--paper); margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  /* سعر الإعلان الفردي هو أهم حاجة في كارته، فبيتعرض كبير فوق بدل ما يتساوى مع باقي الصفوف */
  .group-title .price-lead{font-size:1.1rem; font-weight:800; color:var(--signal); direction:ltr; unicode-bidi:plaintext;}
  .cheapest-badge{
    font-family:var(--mono); font-size:.62rem; font-weight:700; color:var(--ink); background:var(--signal);
    padding:2px 8px; border-radius:8px; flex-shrink:0;
  }
  .group-line{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--mono); font-size:.76rem; padding:4px 0; color:var(--fog);}
  .group-line .g-val{color:var(--paper); text-align:left;}
  /* حالة السيارة كـ"شارة" ملونة حسب الـ tier بدل نص عادي، عشان تُقرأ بصريًا بسرعة من غير قراءة النص كامل */
  .group-line .g-val.tier-pill{
    font-size:.68rem; padding:2px 9px; border-radius:9px; background:rgba(139,147,161,.12); color:var(--fog);
  }
  .group-block.tier-excellent .g-val.tier-pill, .listing-block.tier-excellent .g-val.tier-pill{background:var(--good-dim); color:var(--tier-excellent);}
  .group-block.tier-fair .g-val.tier-pill, .listing-block.tier-fair .g-val.tier-pill{background:var(--signal-dim); color:var(--tier-fair);}
  .group-block.tier-attention .g-val.tier-pill, .listing-block.tier-attention .g-val.tier-pill{background:var(--danger-dim); color:var(--tier-attention);}
  .group-flags{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
  .group-flag{
    font-family:var(--mono); font-size:.66rem; padding:3px 9px; border-radius:10px;
    background:rgba(232,163,61,.12); color:var(--alert); border:1px solid rgba(232,163,61,.3);
  }
  /* قابل للتفاوض = فرصة كويسة للمشتري (أخضر) — سعر نهائي = تحذير إن مفيش هامش مساومة (أحمر خفيف) —
     قبل كده الاتنين كانوا بنفس اللون البرتقالي فمكنش فيه فرق بصري بين المعنيين المختلفين تمامًا */
  .group-flag.flag-negotiable{background:var(--good-dim); color:var(--tier-excellent); border-color:rgba(74,222,128,.35);}
  .group-flag.flag-firm{background:var(--danger-dim); color:var(--tier-attention); border-color:rgba(232,93,77,.35);}
  /* رابط مصدر الإعلان — تحت كل كارت مباشرة عشان تقدر تتحقق من الإعلان الأصلي بضغطة واحدة */
  .listing-source{
    display:flex; align-items:center; gap:6px; margin-top:10px; padding-top:9px; border-top:1px dashed var(--line);
    font-family:var(--mono); font-size:.7rem; color:var(--signal); text-decoration:none; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:left;
  }
  .listing-source:hover{text-decoration:underline;}
  .freshness-tag{
    display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:.68rem; color:var(--good);
    margin-top:10px;
  }
  .freshness-tag::before{content:'●'; font-size:.55rem;}
  .sources-btn{
    margin-top:10px; display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:.7rem;
    border:1px solid var(--line); color:var(--fog); padding:7px 14px; border-radius:14px; cursor:pointer; background:transparent; transition:.2s;
  }
  .sources-btn:hover{border-color:var(--signal); color:var(--signal);}
  .sources-panel{
    display:none; margin-top:8px; padding:10px 12px; background:var(--ink); border:1px solid var(--line); border-radius:6px;
  }
  .sources-panel.open{display:block;}
  .sources-panel a{
    display:flex; justify-content:space-between; gap:8px; color:var(--signal); font-family:var(--mono); font-size:.72rem;
    margin-bottom:8px; text-decoration:none; padding-bottom:8px; border-bottom:1px dashed var(--line);
  }
  .sources-panel a:last-child{margin-bottom:0; border-bottom:none; padding-bottom:0;}
  .sources-panel a:hover{text-decoration:underline;}
  .sources-panel a .src-label{color:var(--paper); flex-shrink:0;}
  .sources-panel a .src-link{color:var(--fog); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:left;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .inline-chip{
    font-family:var(--mono); font-size:.72rem; border:1px solid var(--signal); color:var(--signal);
    padding:7px 14px; border-radius:16px; cursor:pointer; background:transparent; transition:.2s;
  }
  .inline-chip:hover{background:var(--signal); color:var(--ink);}
  /* padding آخر الفوتر بيحترم منطقة الـ home indicator في آيفونات من غير حواف (X وما بعده)،
     وإلا خانة الكتابة والزرار بيبانوا لزقين في شريط النظام السفلي */
  footer{flex-shrink:0; padding:14px 4vw calc(20px + env(safe-area-inset-bottom)); display:flex; justify-content:center;}
  .composer{width:100%; max-width:760px;}
  .composer-box{
    display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:6px 6px 6px 16px; transition:border-color .2s;
  }
  .composer-box:focus-within{border-color:var(--signal);}
  .composer-box input{
    /* الحجم لازم يكون 16px (1rem) بالظبط أو أكتر، وإلا Safari على الآيفون بيزوّم الصفحة كلها تلقائيًا
       لحظة ما المستخدم يدوس على الخانة عشان يكتب — حركة مزعجة جدًا في شات بيتستخدم على الموبايل أساسًا */
    flex:1; background:transparent; border:none; color:var(--paper); font-family:var(--display); font-size:1rem; padding:12px 0;
  }
  .composer-box input:focus{outline:none;}
  .composer-box button{
    /* 44×44 هو أقل مقاس مريح للمس على الموبايل حسب إرشادات آبل/جوجل، وكان 38px قبل كده أصغر من اللازم */
    background:var(--signal); color:var(--ink); border:none; width:44px; height:44px; border-radius:11px;
    cursor:pointer; font-weight:900; flex-shrink:0; transition:.2s;
  }
  .composer-box button:hover{background:#5be6e4;}
  .composer-box button:disabled{opacity:.4; cursor:not-allowed;}
  .composer-note{text-align:center; font-family:var(--mono); font-size:.65rem; color:var(--fog); margin-top:10px;}

  @media (max-width:680px){
    header{padding:10px 4vw;}
    main{padding:14px 4vw 8px;}
    .intro{padding:2px 0 10px;}
    .bubble{max-width:90%;}
  }

  /* ==================== لوحة التحكم بالإعلانات ==================== */
  .hidden{display:none !important;}
  .admin-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .admin-panel{
    background:var(--ink); border:1px solid var(--line); border-radius:16px 16px 0 0;
    width:100%; max-width:720px; max-height:92vh; display:flex; flex-direction:column;
    padding:16px 4vw 20px; overflow:hidden;
  }
  @media (min-width:721px){
    .admin-overlay{align-items:center;}
    .admin-panel{border-radius:16px; max-height:86vh;}
  }
  .admin-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-shrink:0;}
  .admin-header h2{font-size:1.05rem; font-weight:900;}
  .admin-close{
    background:none; border:1px solid var(--line); color:var(--fog); width:32px; height:32px;
    border-radius:8px; cursor:pointer; font-size:.9rem;
  }
  .admin-close:hover{color:var(--paper); border-color:var(--fog);}
  .admin-selectors{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; flex-shrink:0;}
  .admin-selectors select, .admin-new-year{
    background:var(--panel-2); color:var(--paper); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-family:var(--display); font-size:.85rem; flex:1; min-width:110px;
  }
  .admin-selectors select:disabled{opacity:.45; cursor:not-allowed;}
  .admin-listings-area{flex:1; overflow-y:auto; padding-inline-end:4px; margin-bottom:12px; min-height:80px;}
  .admin-empty-hint{color:var(--fog); font-size:.85rem; text-align:center; padding:24px 8px;}
  .admin-row{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px;
    margin-bottom:8px; display:grid; grid-template-columns:1fr 1fr; gap:6px;
  }
  .admin-row.is-stale{border-color:rgba(232,93,77,.5);}
  .admin-row .admin-field{display:flex; flex-direction:column; gap:2px;}
  .admin-row .admin-field.full{grid-column:1 / -1;}
  .admin-row label{font-size:.62rem; color:var(--fog); font-family:var(--mono);}
  .admin-row input{
    background:var(--ink); color:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:6px 8px; font-family:var(--display); font-size:.8rem; width:100%;
  }
  .admin-row-footer{grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .admin-freshness{font-family:var(--mono); font-size:.62rem; padding:2px 8px; border-radius:9px;}
  .admin-freshness.fresh{background:var(--good-dim); color:var(--tier-excellent);}
  .admin-freshness.stale{background:var(--danger-dim); color:var(--tier-attention);}
  .admin-del-btn{
    background:none; border:1px solid var(--danger); color:var(--danger); border-radius:7px;
    padding:5px 10px; font-size:.72rem; cursor:pointer;
  }
  .admin-del-btn:hover{background:var(--danger-dim);}
  .admin-actions-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; flex-shrink:0;}
  .admin-footer-tools{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line);
    padding-top:10px; flex-shrink:0;
  }
  .admin-btn{
    background:transparent; border:1px solid var(--line); color:var(--fog); border-radius:9px;
    padding:8px 12px; font-size:.75rem; cursor:pointer; font-family:var(--display);
  }
  .admin-btn:hover{color:var(--paper); border-color:var(--fog);}
  .admin-btn-small{padding:8px 10px; font-size:.72rem;}
  .admin-btn-primary{background:var(--signal); color:var(--ink); border-color:var(--signal); font-weight:800;}
  .admin-btn-primary:hover{background:#5be6e4; color:var(--ink);}
  .admin-btn-warn{color:var(--alert); border-color:rgba(232,163,61,.4);}
  .admin-btn-warn:hover{background:var(--alert-dim); color:var(--alert);}
  .admin-import-label{cursor:pointer;}
  .admin-status-msg{font-family:var(--mono); font-size:.68rem; color:var(--signal);}

  /* شاشة تسجيل الدخول بجوجل قبل ما لوحة التحكم تظهر */
  .admin-login-box{text-align:center; padding:40px 16px;}
  .admin-login-box p{color:var(--fog); font-size:.82rem; margin-bottom:18px; line-height:1.8;}
  .admin-google-btn{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:#1F1F1F;
    border:none; border-radius:10px; padding:11px 22px; font-family:var(--display); font-size:.85rem;
    font-weight:700; cursor:pointer;
  }
  .admin-google-btn:hover{background:#f1f1f1;}
  .admin-denied-box{color:var(--danger); font-size:.82rem; text-align:center; padding:20px 16px; line-height:1.8;}
  .admin-user-chip{
    display:flex; align-items:center; gap:8px; font-size:.72rem; color:var(--fog);
    font-family:var(--mono); margin-inline-start:auto;
  }
  .admin-user-chip img{width:22px; height:22px; border-radius:50%;}
  .admin-signout-btn{background:none; border:1px solid var(--line); color:var(--fog); border-radius:7px; padding:4px 9px; font-size:.68rem; cursor:pointer;}
</style>
<!-- ==================== Firebase SDK (compat) ====================
     نسخة "compat" عشان تشتغل بوسم استيراد عادي من غير bundler أو type=module.
     الإصدار مثبّت على رقم محدد (10.14.1) عشان الكود ميتكسرش لو Firebase غيّرت حاجة في نسخة أحدث. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<header>

<script>
/* =========================================================
   محرك محلي بالكامل: تطبيع عربي + نية + حسابات فعلية + حوار متعدد الخطوات
   ========================================================= */
const thread = document.getElementById('thread');
const introBlock = document.getElementById('introBlock');
const input = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');

// بعض المستخدمين بيكتبوا بالأرقام العربية/الفارسية (٠١٢٣٤٥٦٧٨٩ / ۰۱۲۳۴۵۶۷۸۹) من لوحة مفاتيح الموبايل،
// وده كان بيكسر استخراج السنة والكيلومترات لأنهم أرقام مختلفة تمامًا عن 0-9 بالنسبة للـ regex
function toWesternDigits(s){
  return (s||'').replace(/[٠-٩۰-۹]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d) >= 0 ? '٠١٢٣٤٥٦٧٨٩'.indexOf(d) : '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
}
function normalize(s){
  return toWesternDigits(s||'')
    .replace(/[\u064B-\u0652]/g,'')
    .replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^\u0600-\u06FF0-9a-zA-Z\s.%]/g,' ')
    .toLowerCase().trim();
}
function firstNumber(s){
  const m = (s||'').replace(/,/g,'').match(/[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}
// تطابق "كلمة كاملة" مش أي جزء من كلمة أطول — لازم عشان كلمة زي "جيب" (ماركة) متتلخبطش
// مع "بتجيب"/"هجيب"/"حجيب" (فعل)؛ نتأكد إن اللي قبل وبعد الكلمة مش حرف أو رقم عربي/إنجليزي
function wordMatch(haystack, needle){
  const esc = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(^|[^\\p{L}\\p{N}])${esc}($|[^\\p{L}\\p{N}])`, 'u');
  return re.test(haystack);
}
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
// بيحاول يستخرج أحدث تاريخ ISO (YYYY-MM-DD) موجود جوه نص التاريخ الحر للإعلان — سواء كان تاريخ
// صريح، أو تاريخ تقريبي متبوع بشرح ("2026-09-19 تقريبًا (منذ 5 أيام...)")، أو فيه تاريخ نشر
// وتاريخ "آخر تحديث" مع بعض (بناخد الأحدث بينهم لأنه الأصدق في تحديد فعليًا آخر ظهور للإعلان).
// بيرجع null لو مفيش أي تاريخ قابل للاستخراج (إعلانات قديمة من دفعات أول ماكانش فيها تاريخ مسجل).
function parseListingDate(dateStr){
  if(!dateStr) return null;
  // لازم نشيل عبارة "وقت الجمع في YYYY-MM-DD" (اللي بنضيفها كمرجع لحساب التاريخ التقريبي) قبل
  // الاستخراج، وإلا هي نفسها هتتفهم غلط كـ"أحدث تاريخ" وتُخفي التاريخ الحقيقي القديم اللي جنبها
  // في نفس الملاحظة (زي إعلانات موسومة بعلامة ⚠️ لأن تاريخها قديم أصلًا)
  const cleaned = String(dateStr).replace(/وقت (الجمع|التشغيل) في \d{4}-\d{2}-\d{2}/g, '');
  const matches = cleaned.match(/\d{4}-\d{2}-\d{2}/g);
  if(!matches || !matches.length) return null;
  let latest = null;
  for(const ds of matches){
    const [y,mo,da] = ds.split('-').map(Number);
    const d = new Date(y, mo-1, da);
    if(!isNaN(d.getTime()) && (!latest || d>latest)) latest = d;
  }
  return latest;
}
// إعلان "طازج" معناه تاريخه (لو قابل للاستخراج) في حدود آخر 60 يوم من دلوقتي. الإعلانات اللي
// مفيهاش تاريخ مسجل أصلًا (دفعات قديمة قبل ما نبدأ نسجل التاريخ) بنسيبها "طازجة افتراضيًا" —
// لأننا منقدرش نحكم عليها بعمر معين، واستبعادها هيفقد بيانات حقيقية بالغلط.
function isListingFresh(listing, maxDays){
  maxDays = maxDays || 60;
  const d = parseListingDate(listing && listing.date);
  if(!d) return true;
  const diffDays = (Date.now() - d.getTime()) / 86400000;
  return diffDays <= maxDays;
}
// نقطة الدخول الموحّدة لقراءة إعلانات موديل/سنة معيّنين لأي رد شات (سعر، مقارنة، تقييم سعر،
// توصية، ميزانية) — بتفلتر الإعلانات اللي عدّى عليها أكتر من 60 يوم تلقائيًا حسب تاريخ جهاز
// المستخدم الفعلي وقت التشغيل (مش تاريخ ثابت في الكود)، عشان الرد يعكس "السعر دلوقتي" فعليًا.
// لوحة التحكم الإدارية بتقرا REAL_LISTINGS مباشرة من غير الفلتر ده، عشان المدير محتاج يشوف
// ويدير كل الإعلانات (حتى القديمة) مش بس الطازجة.
function getFreshListings(model, year){
  const all = REAL_LISTINGS[model] && REAL_LISTINGS[model][year];
  if(!all) return all;
  return all.filter(l => isListingFresh(l, 60));
}
// النطاقات الرقمية (من - إلى) لازم تتعرض LTR حتى جوه صفحة RTL، وإلا الأرقام بتتقلب بصريًا
function ltrRange(low, high){ return `<bdi dir="ltr">${low} – ${high}</bdi>`; }

// مسافة التحرير (Levenshtein) — أساس تحمّل الأخطاء الإملائية: "سيراتوو" أو "كورولاا" لازم تتفهم برضه
function editDistance(a, b){
  const dp = Array.from({length:a.length+1}, (_,i)=>[i, ...new Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[a.length][b.length];
}
// تشابه تقريبي: بيسمح بغلطة إملائية أو اتنين حسب طول الكلمة، مش أكتر
function fuzzyMatches(input, target){
  const a = normalize(input), b = normalize(target);
  if(!a || !b) return false;
  // الاحتواء المباشر (زي "توسان" جوه "هيونداي توسان") مقبول بس لو الكلمتين قريبين في الطول،
  // وإلا كلمة قصيرة جدًا زي "انت" ممكن تبقى بالصدفة substring جوه اسم موديل طويل ("بيكانتو") وتديله تطابق غلط
  const minLen = Math.min(a.length, b.length), maxLen = Math.max(a.length, b.length);
  if((a.includes(b) || b.includes(a)) && minLen / maxLen >= 0.5) return true;
  const threshold = b.length >= 6 ? 2 : 1;
  return editDistance(a, b) <= threshold;
}

/* ---------------- flow (multi-turn slot filling) state ---------------- */
let flow = null; // {type:'loan'|'price', step:number, data:{}}
let msgCounter = 0; // معرّف تصاعدي لكل رسالة، مستخدم في عناصر واجهة زي زرار المصادر
// ذاكرة سياق قصيرة: آخر موديل وسنة اتكلمنا عليهم، عشان لو حد قال "طيب لو 2026" بعد سؤال سعر
// يفهم إنه بيقصد نفس العربية بسنة تانية، من غير ما يعيد كل التفاصيل من الأول
let lastModel = null;
let lastYear = null;
let lastSources = null; // آخر قائمة مصادر اتعرضت، عشان لو المستخدم كتب "المصادر" كنص بدل ما يضغط الزرار
// لو حد كتب "شيفروليه 2022" (ماركة+سنة من غير موديل محدد)، بنحفظ السنة هنا عشان لو رد بعد كده بالموديل بس
// ("أوبترا")، نرد عليه فورًا بسعر السنة اللي قالها بالفعل، بدل ما نسأله "سنة الصنع كام؟" وكأننا مسمعناهوش
let pendingYear = null;
// لو عرضنا للمستخدم موديلات ماركة معيّنة (زي "من موديلات تويوتا: كورولا، ياريس...")، بنفتكرها هنا
// عشان لو سأل سؤال متابعة غامض زي "اكتر حاجة عندك ايه" أو "ايه ارخص واحدة فيهم"، نقدر نرد بالسياق
// بدل ما نرجّع رد عام "مش فاهم قصدك" وكأننا نسينا كل الكلام اللي فات
let lastBrand = null;
let lastBrandModels = null;

/* ---------------- 1) LOAN / INSTALLMENT CALCULATOR ---------------- */
const LOAN_STEPS = [
  {key:'price', ask:'تمام، هحسبلك القسط. سعر العربية الإجمالي كام (بالجنيه)؟'},
  {key:'down',  ask:'تمام. المقدّم قد ايه؟ اكتب مبلغ بالجنيه أو نسبة زي 20%'},
  {key:'months',ask:'المدة كام شهر؟ (مثلاً 36 أو 48 أو 60)'},
  {key:'rate',  ask:'الفايدة السنوية % لو عارفها، أو اكتب "مش عارف" وهفترض متوسط تقريبي 27%'}
];
function startLoanFlow(){
  flow = {type:'loan', step:0, data:{}};
  return LOAN_STEPS[0].ask;
}
function handleLoanStep(text){
  const step = LOAN_STEPS[flow.step];
  if(step.key==='down' && /%/.test(text)){
    const pct = firstNumber(text);
    flow.data.down = pct!==null ? (pct/100)*flow.data.price : null;
    flow.data.downIsPercent = true; flow.data.downPct = pct;
  } else if(step.key==='rate' && /مش عارف|معرفش|مش متاكد/.test(normalize(text))){
    flow.data.rate = 27; flow.data.rateAssumed = true;
  } else {
    const n = firstNumber(text);
    flow.data[step.key] = n;
  }
  flow.step++;
  if(flow.step < LOAN_STEPS.length) return LOAN_STEPS[flow.step].ask;

  // all slots filled → compute
  const {price, down, months, rate} = flow.data;
  if(!price || !months){
    flow = null;
    return 'محتاج أرقام واضحة عشان أحسب صح. جرّب اكتب "احسب قسط" من الأول وقولّي الأرقام بالترتيب.';
  }
  const downAmt = down || 0;
  const principal = Math.max(price - downAmt, 0);
  const r = (rate||0)/12/100;
  const n = months;
  const monthly = r===0 ? principal/n : principal * r * Math.pow(1+r,n) / (Math.pow(1+r,n)-1);
  const total = monthly*n + downAmt;
  const interest = total - price;
  const rateAssumed = flow.data.rateAssumed; // لازم تتحفظ قبل ما نصفّر flow، وإلا العلامة دي مستحيل تظهر أبدًا
  flow = null;
  return {
    text: `دي نتيجة الحساب التقديري:`,
    card: [
      ['سعر العربية', fmt(price)+' ج.م'],
      ['المقدّم', fmt(downAmt)+' ج.م'],
      ['المبلغ الممول', fmt(principal)+' ج.م'],
      ['مدة التقسيط', months+' شهر'],
      ['الفايدة السنوية المستخدمة', (rate||0)+'%' + (rateAssumed?' (افتراضية تقريبية)':'')],
      ['القسط الشهري التقريبي', fmt(monthly)+' ج.م'],
      ['إجمالي المدفوع تقريبًا', fmt(total)+' ج.م'],
      ['إجمالي الفايدة تقريبًا', fmt(interest)+' ج.م'],
    ],
    note:'الأرقام تقديرية بحساب فايدة ثابتة مبسّط — شركات التمويل الفعلية بتحسب بطرق مختلفة (فايدة متناقصة، مصاريف إدارية، تأمين)، فالقسط الفعلي ممكن يختلف. اتأكد من العرض الرسمي قبل ما تقرر.'
  };
}

/* ---------------- 2) PRICE ESTIMATION ---------------- */
// REAL_LISTINGS: سجلات فعلية مجموعة يدويًا من مواقع سيارات مصرية موثوقة (هتلاقي، دوبيزل، ملك كارز...)
// كل سجل هو إعلان حقيقي واحد بتاريخ جمع معروف — مش أسعار بيع نهائية، دي أسعار طلب/إعلانات.
// أضف هنا أي بيانات جديدة تجمعها يوميًا؛ كل ما السجلات تزيد كل ما التقدير يبقى أدق.
const REAL_LISTINGS = {
  'سيراتو': { // كيا سيراتو — جُمعت 2026-08-21 → 2026-08-24 (2024: جيل K3 الجديد كليًا، مختلف عن Grand Cerato القديم)، ودُمجت دفعة 2026-09-24 لسنوات 2021-2023 (جديدة) و2024 (إضافة)؛ موديل 2025 لسه صفر إعلانات فردية مؤهلة بعد محاولة كاملة — راجع BASE_PRICES
    2015: [
      {price:830000, km:179000, source:'hatla2ee'},
      {price:650000, km:150000, source:'hatla2ee'},
      {price:670000, km:213000, source:'hatla2ee'},
      {price:825000, km:146000, source:'dubizzle'},
      {price:620000, km:140000, source:'malekcars', note:'فبريكا داخلي ورشة أجزاء خارجية، محرك وفتيس ممتاز'},
      {price:650000, km:null, source:'lam7cars', note:'الفئة الثانية؛ فابريكة بمواصفات أمان ورفاهية متكاملة', url:'https://lam7cars.com/listing/kia-cerato-2015-second-category-excellent-condition-gray/', date:'2026-08-24'},
      {price:750000, km:110000, source:'hatla2ee', note:'اول فئة؛ فابريكا بالكامل عدا خدوش بسيطة جدًا', url:'https://eg.hatla2ee.com/en/car/kia/cerato/7272198', date:'2026-08-27'},
      {price:625000, km:213000, source:'hatla2ee', note:'اول فئة؛ فابريكة بالكامل؛ العربية كانت مسروقة ورجعت بشاسيه جديد', url:'https://eg.hatla2ee.com/en/car/kia/cerato/7248758', date:'2026-08-28'},
    ],

// يقرأ نص الملاحظة الحرة ويحدد تصنيف حالة الدهان تحديدًا. "الدهان" هنا معناه فابريكا بالكامل، أو فابريكا
// دواخل مع راشة برة على جزء بسيط (باب/رفرف/حزام نظافة/سقف/شنطة/كبوت)، أو رد على البارد، أو ورنيش —
// دي كلها أشكال دهان جزئي طبيعي وشائع (fair)، مختلفة عن مؤشرات أقوى زي حادث أو لحام أو رد على اللحم/النار (attention)
function classifyCondition(note){
  if(!note) return 'unknown';
  const n = normalize(note);
  // "بدون دهان/رش/تغيير..." بتنفي حصول الدهان صراحة — لازم نشيلها الأول وإلا هنفهم عكس قصد الجملة تمامًا.
  // مهم: الصيغة الشائعة "بدون أي دهان" فيها كلمة زيادة ("أي") بين النفي والاسم، فمينفعش نشترط
  // مسافة واحدة بالظبط — لازم نسمح بكلمة أو اتنين زيادة (زي "أي"، "أدنى"، "اي حاجة") من غيرها هنفهم
  // عكس قصد الجملة تمامًا (بدل "دهان = لأ" هنفهمها "دهان = أيوه"). "من غير" صيغة نفي شائعة برضه.
  const nClean = n.replace(/(?:بدون|من غير)[^؛.،]{0,10}(?:دهان|رش|رشه|رشة|تغيير|لحام|خبطه|خبطة)/g, '');
  const looksFullFactory = /فابريك|فبريك|فابريق/.test(n);
  // دهان جزئي بسيط وطبيعي — جزء واحد بس (باب/رفرف/حزام/سقف/شنطة/كبوت/جانب)، أو ورنيش، أو رد على البارد
  const looksMinorPartial = /(?:رش|راش)[^؛.،]{0,12}(?:باب|رفرف|حزام|سقف|شنطة|كبوت|جانب)/.test(nClean)
    || /ورنيش/.test(nClean)
    || /(?:رد|رده)[^؛.،]{0,10}(?:علي|على) البارد/.test(nClean);
  // مؤشرات دهان/تصليح أوسع أو أشد: حادث، لحام، رد على اللحم أو النار، تغيير جسم بالكامل
  const looksMajorWorked = /حادث|لحام|(?:رد|رده)[^؛.،]{0,10}(?:علي|على) (?:اللحم|النار)|تغيير/.test(nClean);
  const looksGenericWorked = /رش|راش|دهان|خبط/.test(nClean);

  if(looksMajorWorked) return 'attention';
  if(looksFullFactory && (looksMinorPartial || looksGenericWorked)) return 'fair';
  if(looksFullFactory) return 'excellent';
  if(looksMinorPartial) return 'fair';
  if(looksGenericWorked) return 'attention';
  return 'unknown';
}
// يحاول يلقط اسم الفئة زي ما اتكتب حرفيًا في نص الإعلان الأصلي (زي "الفئة الثانية" أو "فئة EX" أو "الفئة: توب لاين")
// — بيدور على كلمة "فئة" في النص الأصلي (قبل normalize) عشان يحافظ على الحروف الإنجليزية والتشكيل زي ما هي مكتوبة
function extractCategoryFromNote(note){
  if(!note) return null;
  const m = note.match(/(?:الفئة|فئة)\s*:?\s*([^؛,.،]+)/);
  if(!m) return null;
  const val = m[1].trim().replace(/\s+/g,' ');
  if(!val) return null;
  return 'فئة ' + val;
}
// يلقط تفاصيل الرخصة (مدتها أو تاريخ سريانها) وجهة المرور المذكورة في نص الإعلان، عشان تتعرض في
// خانة مستقلة "الرخصة والمرور" — بيدور على أول جملة تبدأ بـ"رخصة"، وبيضيف ذكر "مرور ..." لو مش داخل
// في نفس الجملة أصلاً (زي "رخصة سنتين. مرور الدقي" بدل "رخصة سنتين مرور الدقي" في نفس الجملة)
function extractLicenseFromNote(note){
  if(!note) return null;
  const parts = [];
  const licMatch = note.match(/(?:الرخصة|رخصة)\s*:?\s*[^؛.،]+/);
  if(licMatch) parts.push(licMatch[0].trim().replace(/\s+/g,' '));
  const murorMatch = note.match(/مرور\s+[^؛.،]+/);
  if(murorMatch && (!licMatch || !licMatch[0].includes(murorMatch[0]))){
    parts.push(murorMatch[0].trim().replace(/\s+/g,' '));
  }
  if(!parts.length) return null;
  return parts.join('؛ ');
}
// بيلقط لو الإعلان بيقول صراحة إن السعر قابل للتفاوض — معلومة مهمة للمشتري بتضيع وسط النص لو محدش نبّه عليها
function isNegotiable(note){
  if(!note) return false;
  const n = normalize(note);
  // مهم: "غير قابل للتفاوض" فيها نص "للتفاوض" برضه، فلازم نستبعد صيغة النفي الأول وإلا هنقول العكس بالظبط
  if(/غير قابل للتفاوض|مش قابل للتفاوض|بدون تفاوض|غير قابله للتفاوض/.test(n)) return false;
  return /للتفاوض|قابل للنقاش|السعر قابل/.test(n);
}
// عكس التفاوض: إعلانات بتقول صراحة إن السعر نهائي وغير قابل للتفاوض (زي "أعلى سعر" أو "الجادين فقط")
function isFirmPrice(note){
  if(!note) return false;

  if(isNegotiable(note)) return false; // لو فيه إشارة تفاوض صريحة فعليًا، متتقالش الاتنين مع بعض
  return /اعلي سعر|السعر نهائي|غير قابل للتفاوض|مش قابل للتفاوض|الجادين فقط/.test(n);
}

function analyzeListings(arr){
  const tagged = arr.map(x => ({...x, tier: classifyCondition(x.note), trim: extractTrim(x.note)}));
  const prices = tagged.map(x=>x.price).sort((a,b)=>a-b);
  const n = prices.length;
  const min = prices[0], max = prices[n-1];
  const median = n%2 ? prices[(n-1)/2] : (prices[n/2-1]+prices[n/2])/2;
  const kms = tagged.map(x=>x.km).filter(k=>k!=null);
  const kmRange = kms.length ? [Math.min(...kms), Math.max(...kms)] : null;

  const tierGroups = {};
  tagged.forEach(x=>{ (tierGroups[x.tier] = tierGroups[x.tier]||[]).push(x.price); });
  const tierStats = {};
  for(const t in tierGroups){
    const p = tierGroups[t];
    tierStats[t] = { n:p.length, avg: p.reduce((a,b)=>a+b,0)/p.length, min:Math.min(...p), max:Math.max(...p) };
  }

  const trimGroups = {};
  tagged.forEach(x=>{ if(x.trim) (trimGroups[x.trim] = trimGroups[x.trim]||[]).push(x.price); });
  const trimStats = {};
  for(const t in trimGroups){
    const p = trimGroups[t];
    trimStats[t] = { n:p.length, avg: p.reduce((a,b)=>a+b,0)/p.length };
  }

  // روابط المصادر (لو متوفرة) — نجمعها من غير تكرار عشان زرار "المصادر" في الرد
  const seenUrls = new Set();
  const sources = [];
  tagged.forEach(x=>{
    if(x.url && !seenUrls.has(x.url)){
      seenUrls.add(x.url);
      sources.push({label:'مشاهدة الإعلان على '+(x.source||'المصدر'), url:x.url});
    }
  });
  // لو مفيش رابط إعلان مباشر محفوظ (بيانات قديمة قبل ما نبدأ نسجّل روابط)، بس عارفين اسم الموقع،
  // نديله رابط عام للموقع نفسه بدل ما الزرار يختفي خالص من غير أي تفسير للمستخدم
  const namedNoUrl = new Set();
  tagged.forEach(x=>{ if(!x.url && x.source && SOURCE_HOME[x.source]) namedNoUrl.add(x.source); });
  namedNoUrl.forEach(s=>{
    const home = SOURCE_HOME[s];
    if(!seenUrls.has(home)){ seenUrls.add(home); sources.push({label: 'مشاهدة إعلانات '+s+' (بحث عام)', url: home}); }
  });
  // تاريخ أحدث بيانات في العينة (لو الإعلانات فيها تاريخ جمع/تحقق مسجَّل)
  const dates = tagged.map(x=>x.date).filter(Boolean).sort();
  const latestDate = dates.length ? dates[dates.length-1] : null;

  return {min, max, median, n, kmRange, tierStats, trimStats, sources, latestDate};
}
function formatArabicDate(iso){
  const parts = (iso||'').split('-').map(Number);
  if(parts.length<3) return iso;
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${parts[2]} ${months[parts[1]-1]} ${parts[0]}`;
}

function findKnownModel(text){
  const n = normalize(text);
  for(const key in REAL_LISTINGS){ if(n.includes(normalize(key))) return key; }
  for(const key in BASE_PRICES){ if(n.includes(normalize(key))) return key; }
  for(const key of KNOWN_MODELS){ if(n.includes(normalize(key))) return MODEL_ALIASES[key] || key; }
  // مفيش تطابق مباشر — نجرّب تشابه تقريبي يتحمّل غلطة إملائية أو اتنين (زي "سيراتوو" أو "كورولاا").
  // بعد ما زاد عدد الموديلات (30+ دلوقتي)، بقى فيه احتمال تصادم بين اسمين متقاربين (زي "تيبو" و"تيجو" — بعدهم حرف واحد بس).
  // عشان كده مبنرجعش أول تطابق تقريبي بالصدفة؛ بنحسب أقرب تطابق فعليًا (أقل مسافة تحرير نسبيًا لطول الكلمة) من كل الاحتمالات.
  const allKeys = Array.from(new Set([...Object.keys(REAL_LISTINGS), ...Object.keys(BASE_PRICES), ...KNOWN_MODELS]));
  const words = n.split(/\s+/).filter(w=>w.length>=3);
  let bestKey = null, bestDist = Infinity;
  for(const key of allKeys){
    const nk = normalize(key);
    for(const w of words){
      if(!fuzzyMatches(w, key)) continue;
      const d = editDistance(w, nk) / Math.max(w.length, nk.length); // نسبي لطول الكلمة عشان مقارنة عادلة بين أسماء مختلفة الطول
      if(d < bestDist){ bestDist = d; bestKey = key; }
    }
  }
  return bestKey ? (MODEL_ALIASES[bestKey] || bestKey) : null;
}
// بيرجع كل الموديلات المذكورة في نفس الرسالة (مش أول واحد بس زي findKnownModel) — أساس فهم
// أسئلة المقارنة ("كورولا 2022 ولا سيراتو 2022 ايه احسن؟") من غير ما نحتاج المستخدم يسأل عن كل موديل لوحده
function findAllKnownModels(text){
  const n = normalize(text);
  const raw = []; // كل التطابقات الخام قبل الفلترة: {key, resolved, pos, len}
  const consider = (key) => {
    const nk = normalize(key);
    const pos = n.indexOf(nk);
    if(pos < 0) return;
    raw.push({resolved: MODEL_ALIASES[key] || key, pos, len: nk.length});
  };
  for(const key in REAL_LISTINGS) consider(key);
  for(const key in BASE_PRICES) consider(key);
  for(const key of KNOWN_MODELS) consider(key);

  // امسح أي تطابق "فرعي" وقع بالكامل جوه تطابق أطول بيغطي نفس المكان في النص (زي "النترا" جوه
  // "النترا AD" أو "النترا HD") — من غيره هيتفهم غلط إنهم موديلين مختلفين اتقالوا في نفس الجملة
  // ويشغّل مقارنة مش مقصودة
  const filtered = raw.filter(a => !raw.some(b => b!==a && b.pos<=a.pos && (b.pos+b.len)>=(a.pos+a.len) && b.len>a.len));

  const found = [];
  for(const m of filtered){ if(!found.some(f=>f.model===m.resolved)) found.push({model:m.resolved, pos:m.pos}); }
  return found.sort((a,b)=>a.pos-b.pos).map(f=>f.model);
}
function extractYear(text){
  const n = normalize(text);
  // ردود لفظية شائعة بدل رقم صريح — لو حد قال "زيرو" أو "جديدة" أو "حديثة" أو "احدث سنة"،
  // ده معناه عايز أحدث سنة موجودة (عمليًا سنة النهاردة)، مش إنه هيفضل يتجاهل السؤال ونلف في حلقة بلا نهاية
  if(n.includes('زيرو') || n.includes('صفر') || n.includes('جديد') || n.includes('حديث') || n.includes('احدث')) return new Date().getFullYear();
  const m = (text||'').match(/(19|20)\d{2}/);
  if(m) return parseInt(m[0]);
  // دعم الصيغة المختصرة اللي الناس بتستخدمها فعليًا زي "كورولا 22" يعني موديل 2022
  const m2 = (text||'').match(/\b(\d{2})\b/);
  if(m2){
    const yy = parseInt(m2[1]);
    if(yy <= 30) return 2000 + yy; // مدى منطقي لموديلات حديثة (٢٠٠٠-٢٠٣٠)
    if(yy >= 90) return 1900 + yy; // لو حد كتب "٩٥" مثلاً لموديل قديم
  }
  return null;
}
// كشف مباشر: لو حد كتب "كيا سيراتو 2015" في رسالة واحدة، افهم قصده ورد فورًا بالتفصيل الكامل من غير أي سؤال إضافي
function tryDirectPriceQuery(text){
  const model = findKnownModel(text);
  const year = extractYear(text);
  const km = extractKm(text);
  if(model && year){
    pendingYear = null; // اتحددت السنة صريح في نفس الرسالة، مفيش داعي لأي سنة معلّقة من قبل
    return buildPriceAnswer(model, year, km);
  }
  if(model && !year){
    // لو كان فيه سنة اتقالت قبل كده (مثلاً في رسالة "شيفروليه 2022" قبل ما نعرف الموديل بالظبط)،
    // نستخدمها على طول من غير ما نسأل تاني
    if(pendingYear){
      const y = pendingYear;
      pendingYear = null;
      return buildPriceAnswer(model, y, km);
    }
    flow = {type:'price', step:1, data:{model, km}};
    return `تمام، ${model}. ` + PRICE_STEPS[1].ask;
  }
  return null;
}
// يعرض كل إعلان حقيقي لوحده كارت مستقل (مش مجمّع في فئات) — أوضح للمستخدم إنه شايف إعلانات فعلية
// وليها روابط حقيقية، مش تصنيف آلي مجمّع بيضيّع تفاصيل كل إعلان على حدة
function buildListingRows(listings, model, year){
  const tagged = listings.map(x => ({...x, tier: classifyCondition(x.note)}));
  const sorted = [...tagged].sort((a,b)=>a.price-b.price);
  const brand = model ? brandOfModel(model) : null;

  return sorted.map((x, idx) => {
    const flags = [];
    if(isNegotiable(x.note)) flags.push({label:'قابل للتفاوض', kind:'negotiable'});
    if(isFirmPrice(x.note)) flags.push({label:'سعر نهائي', kind:'firm'});

    // رابط الإعلان نفسه لو محفوظ، وإلا رابط الموقع العام كبديل عشان الزرار/الرابط ميختفيش خالص
    let source = null;
    if(x.url){ source = {label:'مشاهدة الإعلان على '+(x.source||'المصدر'), url:x.url}; }
    else if(x.source && SOURCE_HOME[x.source]){ source = {label:'مشاهدة إعلانات '+(x.source||'المصدر')+' (بحث عام)', url:SOURCE_HOME[x.source]}; }

    // خانة الحالة بتركّز على حالة الدهان تحديدًا بس (فابريكا بالكامل / دهان جزئي / فيها ملاحظات) —
    // الفئة والرخصة/المرور بقوا خانتين مستقلتين لوحدهم، بدل ما يتزنقوا جوه نص خانة الحالة
    const category = extractCategoryFromNote(x.note);
    const license = extractLicenseFromNote(x.note);
    // عنوان فوق كل كارت (زي "تويوتا كورولا 2022 الفئة الثالثة") — بيجمع الماركة والموديل والسنة،
    // وبيضيف اسم الفئة في الآخر لو مذكور عشان يبان العنوان مميز عن باقي الإعلانات في نفس الكارت
    const title = [brand, model, year, category].filter(Boolean).join(' ');
    return {
      listing: true,
      tier: x.tier,
      title,
      km: x.km!=null ? fmt(x.km)+' كم' : 'غير محدد',
      condition: TIER_LABELS[x.tier],
      category: category || 'الفئة غير مذكورة',
      license: license || 'غير مذكورة',
      price: fmt(x.price)+' ج.م',
      flags,
      cheapest: idx===0 && sorted.length>1,
      source
    };
  });
}
// يحسب "أفضل قيمة مقابل السعر" من عينة إعلانات حقيقية — مش أرخص سعر بالضرورة، لكن أفضل توازن بين
// السعر والكيلومترات والحالة. مقصود يكون اقتراح مبدئي يساعدك تبدأ بيه، مش قرار نهائي بديل عن معاينتك بنفسك.
function recommendBest(listings){
  const tagged = listings.map(x => ({...x, tier: classifyCondition(x.note)}));
  const prices = tagged.map(x=>x.price);
  const kms = tagged.map(x=>x.km).filter(k=>k!=null);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const minK = kms.length ? Math.min(...kms) : null, maxK = kms.length ? Math.max(...kms) : null;
  const tierScore = {excellent:1, fair:0.6, unknown:0.4, attention:0.1};

  let best = null, bestScore = -Infinity;
  tagged.forEach(x=>{
    const priceScore = maxP===minP ? 0.5 : 1 - (x.price - minP)/(maxP - minP); // أرخص = أعلى نقاط
    const kmScore = (x.km==null || minK==null || maxK===minK) ? 0.5 : 1 - (x.km - minK)/(maxK - minK); // أقل كيلومترات = أعلى نقاط
    const condScore = tierScore[x.tier] ?? 0.4;
    const score = priceScore*0.35 + kmScore*0.3 + condScore*0.35;
    if(score > bestScore){ bestScore = score; best = x; }
  });
  if(!best) return null;

  const reasons = [];
  if(best.price <= minP*1.03) reasons.push('من أرخص الأسعار في العينة');
  if(best.km!=null && minK!=null && best.km <= minK*1.15) reasons.push('كيلومترات قليلة نسبيًا');
  if(best.tier==='excellent') reasons.push('حالة سليمة/فابريكة حسب النص');
  if(!reasons.length) reasons.push('أفضل توازن عام بين السعر والكيلومترات والحالة في العينة');

  return {best, reasons};
}
// سؤال متابعة غامض بعد ما عرضنا موديلات ماركة (زي "اكتر حاجة عندك ايه" أو "ايه ارخص واحدة فيهم")
// — المستخدم مش بيسمّي موديل، فبنستخدم آخر قائمة موديلات ماركة اتعرضت ونقارن بالسعر الرسمي (زيرو) بينهم
function handleBrandExtremeQuestion(text){
  if(!lastBrandModels || !lastBrandModels.length) return null;
  const n = normalize(text);
  const wantsMost = /اكتر حاجه|اكثر حاجه|اغلى|الاعلى سعر|اعلى سعر/.test(n);
  const wantsLeast = /ارخص|اقل سعر|الاقل سعر/.test(n);
  if(!wantsMost && !wantsLeast) return null;
  const priced = lastBrandModels
    .map(m => ({model:m, price:baseOf(m), verified:baseIsVerified(m)}))
    .filter(x => x.price != null);
  if(!priced.length){
    return `معنديش أسعار رسمية موثّقة لأي موديل من موديلات ${lastBrand} أقارن بيها لسه.`;
  }
  priced.sort((a,b) => wantsMost ? b.price-a.price : a.price-b.price);
  const top = priced[0];
  const label = wantsMost ? 'أغلى' : 'أرخص';
  return `${label} موديل عندي من ${lastBrand} بالسعر الرسمي الحالي (وهو جديد) هو ${top.model}، بحوالي ${fmt(top.price)} ج.م${top.verified?' ✓ موثّق':' — غير موثّق بمصدر حديث'}. لو عايز سعره مستعمل، قولّي سنة الصنع.`;

function buildPriceAnswer(model, year, km){

  if(age > 6){
    return {

  // موديل السنة الحالية أو اللي قبلها — دي أصلًا مش "سيارة مستعملة ناقصها بيانات"، دي عربية جديدة عمليًا.
  // غياب سوق مستعمل ليها طبيعي جدًا مش نقص، فالرسالة لازم تعكس كده بدل ما تتكلم عن "غياب بيانات مستعملة"
  if(age <= 1){

  return {

function extractCondition(text){
  const n = normalize(text);
  if(n.includes('ممتاز')) return 'excellent';
  if(n.includes('متوسط')) return 'fair';
  if(n.includes('جيد')) return 'good';
  return null;
}
// يحاول يلقط رقم كيلومترات من كلام حر ("ماشية 150 الف" أو "120000 كم" أو "120,000 كم" أو "80k") — مش سؤال إجباري، بس بيتلقط لو المستخدم ذكره من نفسه
function extractKm(text){
  // فاصلة الآلاف ("120,000 كم") كانت بتكسر مطابقة الأرقام لأنها بتقطع سلسلة الأرقام المتصلة
  const n = normalize(text).replace(/(\d),(\d{3})/g, '$1$2');
  // لازم negative lookahead بعد "الف"/"كم" يمنع الكلمة من إنها تكون بداية كلمة تانية أطول
  // (زي "الفئة" اللي بعد normalize بتبقى "الفيه" وتبدأ بنفس حروف "الف" — من غير الشرط ده كان
  // بيتفهم إنها "الف" (ألف/ثلاث أصفار) غلط ويطلع رقم كيلومترات وهمي من رقم سنة الموديل)
  let m = n.match(/(\d+)\s*(الف|ألف)(?![\u0621-\u064A])\s*(كم|كيلو)?/);
  if(m) return parseInt(m[1]) * 1000;
  m = n.match(/(\d{4,6})\s*(كم(?![\u0621-\u064A])|كيلومتر)/);
  if(m) return parseInt(m[1]);
  // اختصار إنجليزي شائع عند بعض الشباب ("80k" أو "80 k" يعني 80 ألف كيلومتر)
  m = n.match(/\b(\d{1,3})\s*k\b/);
  if(m) return parseInt(m[1]) * 1000;
  return null;
}
// يحاول يلقط ميزانية/سعر مستهدف من كلام حر ("سعر 600 الف"، "ميزانيتي 450000"، "في حدود 300 الف جنيه")
// — ده مختلف عن extractKm (كيلومترات) وextractYear (سنة)، ده رقم فلوس المستخدم عايز يشتري بيه
function extractBudget(text){
  const n = normalize(text).replace(/(\d),(\d{3})/g, '$1$2');
  // نفس تصحيح extractKm: منع "الف" من إنها تتقرا غلط جوه كلمة أطول زي "الفئة"
  let m = n.match(/(\d+(?:\.\d+)?)\s*(الف|ألف)(?![\u0621-\u064A])/);
  if(m) return parseFloat(m[1]) * 1000;
  // رقم صريح كبير (يعني اتكتب كامل من غير "الف") — بنشترط 5 خانات فأكتر عشان ما نلخبطش مع سنة موديل زي "2022"
  m = n.match(/\b(\d{5,8})\b/);
  if(m) return parseInt(m[1]);
  return null;
}
// سؤال "ايه انسب سيارة في سعر/ميزانية كذا؟" مختلف تمامًا عن سؤال "سعر موديل معيّن" — هنا المستخدم
// مش قاصد موديل بعينه، وعايز نقترحله من كل الموديلات اللي عندنا بيانات حقيقية عنها قريبة من رقمه
function isBudgetRecommendationQuery(text){
  const n = normalize(text);
  const wantsRecommendation = /انسب|افضل|احسن|توصيني|رشحلي|اقترح/.test(n);
  const mentionsCar = /سياره|عربيه|موديل/.test(n);
  return wantsRecommendation && mentionsCar && extractBudget(text) != null;
}
// بيدور في كل الموديلات والسنين المتاحة (مش موديل واحد بس) على إعلانات حقيقية قريبة من الميزانية،
// ولو مالقاش حاجة قريبة كفاية بيوسّع هامش البحث تلقائيًا بدل ما يرجع "مفيش نتائج" على طول
function findListingsNearBudget(budget, tolerance){
  const matches = [];
  for(const model in REAL_LISTINGS){
    for(const year in REAL_LISTINGS[model]){
      for(const l of getFreshListings(model, year) || []){
        if(Math.abs(l.price - budget) <= budget*tolerance){
          matches.push({...l, model, year:Number(year)});
        }
      }
    }
  }
  matches.sort((a,b)=>Math.abs(a.price-budget)-Math.abs(b.price-budget));
  return matches;
}
function buildBudgetAnswer(text){
  const budget = extractBudget(text);
  if(budget == null) return null;
  let tolerance = 0.15;
  let matches = findListingsNearBudget(budget, tolerance);
  if(!matches.length){ tolerance = 0.30; matches = findListingsNearBudget(budget, tolerance); }
  if(!matches.length){
    return `مالقيتش في العينة الحقيقية اللي عندي أي إعلان قريب من ${fmt(budget)} ج.م حتى بهامش أوسع. جرّب تقولّي موديل معيّن (زي كورولا أو بيكانتو) وهقولّك أقرب سنة تناسب الميزانية دي.`;
  }
  const top = matches.slice(0, 6);
  const card = top.map(l => [
    `${l.model} ${l.year}`,
    fmt(l.price)+' ج.م' + (l.km!=null ? ` — ${fmt(l.km)} كم` : '') + (l.source ? ` (${l.source})` : '')
  ]);
  const seenUrls = new Set(); const sources = [];
  top.forEach(l=>{ if(l.url && !seenUrls.has(l.url)){ seenUrls.add(l.url); sources.push({label:`${l.model} ${l.year} — ${l.source||'مصدر'}`, url:l.url}); } });
  return {
    text: `في حدود ${fmt(budget)} ج.م، دي أقرب ${top.length} إعلانات حقيقية عندي من موديلات مختلفة:`,
    card,
    sources: sources.length ? sources : undefined,
    note: (tolerance>0.15 ? `وسّعت هامش البحث شوية لأنه ما كانش فيه عدد كافي قريب جدًا من ${fmt(budget)} ج.م بالظبط. ` : '') + 'دي أسعار عرض من إعلانات حقيقية مش أسعار بيع نهائية. لو عايز تفاصيل أدق، قولّي موديل وسنة معيّنين من القايمة دي.'
  };
}
// سؤال "السعر ده كويس ولا لأ؟" — مختلف عن سؤال "سعر الموديل قد ايه؟" العادي، لأن المستخدم هنا
// عنده رقم معيّن في دماغه (سعر شافه في إعلان أو اتفق عليه) وعايز رأي: ده غالي، رخيص، ولا عادل؟
// بنرجع null لو أي عنصر من التلاتة (موديل/سنة/سعر) ناقص أو مفيش عينة حقيقية نقارن بيها، عشان

  if(!wantsVerdict) return null;

  // من الصفر. لازم نستخدم السياق (آخر موديل وسنة) بدل ما نسيبه يقع في فلو "الموديل والماركة ايه؟"
  // اللي بيتجاهل إننا أصلًا عارفين عن أنهي عربية بيتكلم

      card:[
        ['النطاق الحقيقي عندي (من '+a.n+' إعلان)', ltrRange(fmt(a.min), fmt(a.max))+' ج.م'],
        ['الوسيط (نص العينة)', fmt(a.median)+' ج.م'],

  }
  lastModel = model; lastYear = year;
  return {
    text: `سألتني عن سعر ${fmt(price)} ج.م لـ ${model} موديل ${year} — قارنته بـ${a.n} إعلان حقيقي عندي:`,
    card:[
      {headline:true, label:'السعر اللي سألت عنه', value: fmt(price)+' ج.م'},
      ['نطاق الأسعار الحقيقي في العينة', ltrRange(fmt(a.min), fmt(a.max))+' ج.م'],
      ['الوسيط (نص العينة)', fmt(a.median)+' ج.م'],
    ],
    sources: a.sources && a.sources.length ? a.sources : undefined,
    note: verdict + ' (دي مقارنة بعينة إعلانات محدودة، مش تقييم رسمي نهائي — المعاينة الفعلية بتفرق.)'
  };
}
// سؤال مقارنة بين موديلين ("كورولا 2022 ولا سيراتو 2022 ايه احسن؟") — لقاء موديلين معروفين في نفس
// الرسالة كافي كإشارة على نية المقارنة، من غير ما نشترط كلمة "قارن" صريحة (الناس نادرًا بتستخدمها فعليًا)
function checkCompareModels(text){
  const models = findAllKnownModels(text);
  if(models.length < 2) return null;
  const [m1, m2] = models;
  const year = extractYear(text) || lastYear;
  if(!year){
    return `عايز أقارن بين ${m1} و${m2}، بس محتاج أعرف السنة الأول (زي "${m1} و${m2} موديل 2022"). قولّيها وهرد عليك بالتفصيل.`;
  }
  const sideOf = (model) => {
    const listings = getFreshListings(model, year);
    if(listings && listings.length){
      const a = analyzeListings(listings);
      return {model, has:true, n:a.n, min:a.min, max:a.max, mid:(a.min+a.max)/2};
    }
    const base = baseOf(model);
    return {model, has:false, base, verified: base!=null ? baseIsVerified(model) : false};
  };
  const s1 = sideOf(m1), s2 = sideOf(m2);
  lastModel = m2; lastYear = year;

  const rows = [s1, s2].map(s=>{
    if(s.has) return [`${s.model} ${year} — نطاق السعر (${s.n} إعلان حقيقي)`, ltrRange(fmt(s.min), fmt(s.max))+' ج.م'];
    if(s.base!=null) return [`${s.model} ${year} — مفيش إعلانات مستعملة حقيقية، السعر الرسمي (جديدة)`, fmt(s.base)+' ج.م'+(s.verified?' ✓ موثّق':' — غير موثّق')];
    return [`${s.model} ${year}`, 'معنديش أي بيانات سعر ليه لسه'];
  });

  let verdict = '';
  if(s1.has && s2.has){
    const cheaper = s1.mid <= s2.mid ? s1.model : s2.model;
    verdict = ` بشكل عام، ${cheaper} أرخص في المتوسط بين الاتنين من عينة الإعلانات الحقيقية.`;
  } else if(s1.has !== s2.has){
    verdict = ` عندي عينة إعلانات حقيقية لـ${s1.has?s1.model:s2.model} بس، مش لـ${s1.has?s2.model:s1.model} في نفس السنة، فالمقارنة هنا تقريبية.`;
  }

  return {
    text: `مقارنة ${m1} و${m2} موديل ${year}:`,
    card: rows,
    note: `دي مقارنة مبدئية من البيانات المتاحة.${verdict} لو عايز تفاصيل كل موديل لوحده بالإعلانات الفردية، اسأل عنه لوحده (زي "${m1} ${year}").`
  };
}
// ردود بتدل إن المستخدم مش قاصد تحديد حاجة معيّنة ("اي موديل"، "مش مهم") — لازم نتعامل معاها
// غير سؤال المستخدم نفس السؤال تاني، وإلا هنلف في حلقة بلا نهاية زي لما حد يقول "اي عام" ونرجع نسأل "سنة الصنع كام؟"
function looksLikeAnyAnswer(text){
  const n = normalize(text);
  return /^(اي|أي)\s|مش مهم|مش محدد|مفيش تحديد|اي حاجه|مايهمش|لا يهم|زي ما تحب|ماعنديش تحديد/.test(n);
}
// كلمات بتدل إن المستخدم بيصحّح حاجة قالها قبل كده ("لأ مش كورولا، سيراتو") مش بيجاوب سؤال جديد
function looksLikeCorrection(text){
  const n = normalize(text);
  // \b مش موثوق فيها مع العربي في JS (بتعتبر الحروف العربية مش "حروف كلمة")، فبنتأكد بمسافة أو نهاية النص بدلها
  return /^(لا|مش|غلط|قصدي|اقصد|بدل|اسف)(\s|$)/.test(n) || /مش قصدي|مش كده|غلطت|اقصد ان/.test(n);
}
function handlePriceStep(text){
  const step = PRICE_STEPS[flow.step];
  const correcting = looksLikeCorrection(text);

  // ردود زي "اي موديل" أو "اي عام" مش إجابة فعلية على السؤال — لازم نتصرف بدل ما نخزّنها كموديل حرفي غلط
  // أو نفضل نكرر نفس السؤال للأبد (زي ما حصل لما حد قال "اي عام" ورجعنا نسأل "سنة الصنع كام؟" تاني وتاني)
  if(step.key==='model' && flow.data.model==null && looksLikeAnyAnswer(text)){
    flow = null;
    return 'محتاج على الأقل اسم موديل واحد عشان أدوّر في بيانات حقيقية (زي "كورولا" أو "بيكانتو") — لو مش قاصد موديل معيّن وعايز اقتراح بميزانية، قولّي مثلاً "انسب عربية في سعر 300 الف" وهدوّرلك في كل الموديلات.';
  }
  if(step.key==='year' && flow.data.year==null && looksLikeAnyAnswer(text)){
    // نختارله أحدث سنة عندنا بيانات حقيقية ليها لنفس الموديل بدل ما نسأل من غير فايدة
    const years = REAL_LISTINGS[flow.data.model] ? Object.keys(REAL_LISTINGS[flow.data.model]).map(Number) : [];
    if(years.length){
      flow.data.year = Math.max(...years);
    } else {
      const m = flow.data.model; flow = null;
      return `معنديش إعلانات حقيقية مصنّفة بسنين لـ "${m}" أختارلك منها تلقائي. قولّي سنة رقمية معيّنة (زي 2019) عشان أقدر أدورلك.`;
    }
  }

  if(step.key==='model' && (flow.data.model==null || correcting)){
    const m = findKnownModel(text);
    if(m || flow.data.model==null) flow.data.model = m || text.replace(/^(لا|لأ|مش|غلط|قصدي|اقصد|بدل|آسف|اسف)\s*/,'').trim();
  } else if(step.key==='year' && (flow.data.year==null || correcting)){
    const y = extractYear(text) || firstNumber(text);
    if(y || flow.data.year==null) flow.data.year = y;
  }
  // نلقط أي معلومة زيادة اتقالت في نفس الرسالة حتى لو مكنش ده سؤالنا (موديل+سنة مع بعض، أو كيلومترات)
  if(flow.data.model==null || correcting){ const m = findKnownModel(text); if(m) flow.data.model = m; }
  if(flow.data.year==null || correcting){ const y = extractYear(text); if(y) flow.data.year = y; }
  if(flow.data.km==null){ const k = extractKm(text); if(k) flow.data.km = k; }

  const next = PRICE_STEPS.findIndex(s => flow.data[s.key]==null);
  if(next !== -1){ flow.step = next; return (correcting ? 'تمام، صححتها. ' : '') + PRICE_STEPS[next].ask; }

  const {model, year, km} = flow.data;
  flow = null;
  return buildPriceAnswer(model, year, km);
}

/* ---------------- 3) LICENSING / PAPERWORK GUIDANCE ---------------- */
const LICENSE_FAQ = [
  {kws:['نقل ملكيه','تحويل ملكيه','استماره باسمي','تسجيل العربيه باسمي'], answer:'خطوات نقل الملكية عمومًا: عقد بيع موثّق بين البائع والمشتري، التأكد إن السيارة مش عليها مخالفات أو رهن، التوجه لإدارة المرور المختصة بالأوراق والفحص الفني، سداد الرسوم المقررة، واستلام رخصة جديدة باسم المالك الجديد. الإجراءات والرسوم بتتحدث بقرارات المرور، فراجع آخر تحديث رسمي قبل الذهاب.'},
  {kws:['تجديد رخصه','رخصه انتهت','الرخصه خلصت','رخصتي خلصت'], answer:'تجديد رخصة السيارة عادة يحتاج: الفحص الدوري الفني، سداد الرسوم والمخالفات لو موجودة، وتقديم الطلب بمكتب المرور أو المنصة الرقمية المتاحة. المدة والرسوم بتختلف حسب نوع المركبة.'},
  {kws:['فحص دوري','فحص فني','فحص شامل'], answer:'الفحص الدوري بيغطي عادة: الفرامل، الإضاءة، العادم والانبعاثات، وحالة الإطارات والهيكل العام. لازم يتم في مركز فحص معتمد قبل تجديد الرخصة.'},
  {kws:['جمارك','عربيه مستورده'], answer:'الجمارك على السيارات المستوردة بتتحدد حسب فئة السيارة وسعة المحرك وسنة الصنع، والنسب بتتغير بقرارات حكومية دورية. الأفضل تراجع مصلحة الجمارك المصرية مباشرة أو مكتب تخليص جمركي معتمد للأرقام الحالية بالظبط.'},
];
function checkLicenseFAQ(text){
  const n = normalize(text);
  for(const f of LICENSE_FAQ){
    if(f.kws.some(k=>n.includes(normalize(k)))) return f.answer;
  }
  return null;
}

/* ---------------- top-level intent router ---------------- */
function detectTopIntent(text){
  const n = normalize(text);
  if(/قسط|تقسيط|تمويل|فايده سنويه|احسب قسط/.test(n)) return 'loan';
  // "بكام" و"قد ايه" من أكتر الصيغ اللي الناس بتسأل بيها عن السعر في العامية المصرية،
  // وكانوا مش متغطين قبل كده إلا لو اتقالوا مع "تقريبا" أو "سعر" صريحة
  if(/سعر|يستاهل كام|قيمه تقريبيه|بكام|قد ايه|كام سعر|غالي|رخيص|مبالغ فيه|مظبوط السعر|مضبوط السعر/.test(n)) return 'price';
  if(/نقل ملكيه|تجديد رخصه|فحص دوري|جمارك|رخصه انتهت|فحص فني/.test(n)) return 'license';
  return null;
}

/* ---------------- كلام عام: تحية، شكر، سؤال عن الإمكانيات ---------------- */
const SMALL_TALK = [
  {kws:['شكرا','متشكر','تسلم','يعطيك العافيه','مشكور'], answer:'العفو، تحت أمرك في أي وقت 🚗'},
  // "السلام عليكم" ليها رد التحية الإسلامية المتعارف عليه ("وعليكم السلام") قبل أي حاجة تانية —
  // مكنش كافي إن البوت يقفز على الترحيب العام من غير ما يرد على التحية الأول، ده حسّاس ثقافيًا
  {kws:['السلام عليكم'], answer:'وعليكم السلام ورحمة الله وبركاته! تقدر تسألني عن حساب قسط، تقييم سعر سيارة (زي "كورولا 2018")، أو إجراءات ترخيص ونقل ملكية.'},
  {kws:['مرحبا','اهلا','اهلا بيك','هاي','ازيك','صباح الخير','مساء الخير'], answer:'أهلًا بيك! تقدر تسألني عن حساب قسط، تقييم سعر سيارة (زي "كورولا 2018")، أو إجراءات ترخيص ونقل ملكية.'},
  {kws:['تقدر تعمل ايه','امكانياتك ايه','بتعمل ايه','مين انت','انت مين','من انت','منت مين'], answer:'أنا رفيق — مساعد السيارات الذكي: بساعدك تعرف اسعار العربيات في مصر وأنصحك بأفضل اختيار (سعر مقابل قيمة).'},
  {kws:['باي','مع السلامه','تصبح على خير','تصبحي على خير','يسعد مساك','في امان الله'], answer:'تحت أمرك في أي وقت، مع السلامة 🚗'},
];
function checkSmallTalk(text){
  const n = normalize(text);
  for(const s of SMALL_TALK){ if(s.kws.some(k=>n.includes(normalize(k)))) return s.answer; }
  return null;
}

/* ---------------- UI rendering ---------------- */
function addRow(role, content){
  if(introBlock) introBlock.remove();
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const av = document.createElement('div');
  av.className = 'avatar ' + role;
  av.textContent = role==='bot' ? 'ر' : 'أ';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if(typeof content === 'string'){
    bubble.textContent = content;
  } else {
    bubble.appendChild(document.createTextNode(content.text));
    if(content.card){
      const card = document.createElement('div');
      card.className = 'result-card';
      content.card.forEach(item=>{
        const r = document.createElement('div');
        if(Array.isArray(item)){
          const [k,v] = item;
          r.className = 'result-row';
          r.innerHTML = `<span>${k}</span><b>${v}</b>`;
        } else if(item.rangeHero){
          // بند النطاق — أول حاجة تتعرض في الكارت، بيلخص سعر وعدادات كل الإعلانات المعروضة في نظرة واحدة
          r.className = 'range-hero';
          r.innerHTML = `<div class="range-stat"><span class="range-label">${item.priceLabel}</span><b class="range-value">${item.priceValue}</b></div><div class="range-stat"><span class="range-label">${item.kmLabel}</span><b class="range-value">${item.kmValue}</b></div>`;
        } else if(item.listing){
          // كارت إعلان فردي — كل إعلان حقيقي لوحده بتفاصيله ورابط مصدره تحته مباشرة
          r.className = 'listing-block tier-' + (item.tier || 'unknown') + (item.cheapest ? ' is-cheapest' : '');
          const flagsHtml = item.flags && item.flags.length
            ? `<div class="group-flags">${item.flags.map(f=>`<span class="group-flag flag-${f.kind}">${f.label}</span>`).join('')}</div>`
            : '';
          const cheapestBadge = item.cheapest ? `<span class="cheapest-badge">الأقل سعرًا</span>` : '';
          const sourceHtml = item.source
            ? `<a class="listing-source" href="${item.source.url}" target="_blank" rel="noopener noreferrer">🔗 ${item.source.label}</a>`
            : '';
          const titleHtml = item.title ? `<div class="listing-title">${item.title}</div>` : '';
          r.innerHTML = `${titleHtml}<div class="group-title"><span class="g-val price-lead">${item.price}</span>${cheapestBadge}</div><div class="group-line"><span>الكيلومترات</span><span class="g-val">${item.km}</span></div><div class="group-line"><span>الحالة</span><span class="g-val tier-pill">${item.condition}</span></div><div class="group-line"><span>الفئة</span><span class="g-val">${item.category}</span></div><div class="group-line"><span>الرخصة والمرور</span><span class="g-val">${item.license}</span></div>${flagsHtml}${sourceHtml}`;
        } else {
          // صف "headline" — التقدير الأهم، بيتعرض أكبر وفوق باقي التفاصيل
          r.className = 'result-row headline';
          r.innerHTML = `<span>${item.label}</span><b>${item.value}</b>`;
        }
        card.appendChild(r);
      });
      bubble.appendChild(card);
    }
    if(content.freshness){
      const fr = document.createElement('div');
      fr.className = 'freshness-tag';
      fr.textContent = content.freshness;
      bubble.appendChild(fr);
    }
    if(content.sources && content.sources.length){
      lastSources = content.sources; // نفتكرها عشان لو المستخدم كتب "المصادر" كنص بعد كده
      msgCounter++;
      const btn = document.createElement('button');
      btn.className = 'sources-btn';
      btn.type = 'button';
      btn.textContent = `🔗 المصادر (${content.sources.length})`;
      const panel = document.createElement('div');
      panel.className = 'sources-panel';
      content.sources.forEach(s=>{
        const a = document.createElement('a');
        a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.innerHTML = `<span class="src-label">${s.label}</span><span class="src-link">${s.url}</span>`;
        panel.appendChild(a);
      });
      btn.addEventListener('click', ()=>{ panel.classList.toggle('open'); });
      bubble.appendChild(btn);
      bubble.appendChild(panel);
    }
    if(content.note){
      const note = document.createElement('div');
      note.style.cssText = 'margin-top:10px; font-family:var(--display); font-size:.85rem; color:var(--paper); opacity:.85; line-height:1.8;';
      note.textContent = content.note;
      bubble.appendChild(note);
    }
  }
  row.appendChild(av); row.appendChild(bubble);
  thread.appendChild(row);
  document.querySelector('main').scrollTop = document.querySelector('main').scrollHeight;
  return row;
}

function addTyping(){

  row.innerHTML = `<div class="avatar bot">ر</div><div class="bubble typing">بيفكر…</div>`;
  thread.appendChild(row);
  document.querySelector('main').scrollTop = document.querySelector('main').scrollHeight;

function respondTo(text){
  // لو فيه محادثة متعددة الخطوات شغالة بس الرسالة الجديدة واضح إنها موضوع تاني (عطل/سؤال إجرائي/إلغاء)
  // نلغي المحادثة القديمة بدل ما نبتلع الرسالة غلط كإجابة على سؤال معلّق
  if(flow){
    const n0 = normalize(text);
    const looksLikeCancel = /الغ|انسى|بلاش|رجعني|من الاول/.test(n0);
    const looksLikeOtherIntent = checkLicenseFAQ(text);
    // رسائل ارتباك أو خروج عن الموضوع ("انت عامل ايه"، "مش فاهم") — مش إجابة على السؤال المعلّق،
    // فمينفعش نرجّع نفس السؤال تاني وكأننا مسمعناش، لازم نوضّح إحنا مستنيين ايه بالظبط
    const looksConfused = /عامل ايه|فاهم ايه|مش فاهم|ايه ده|بتقول ايه|انت مين|هو ايه|ليه بتسأل/.test(n0);
    // "منا قلتلك" / "قلت لك" — المستخدم متضايق لأنه حاسس إنه جاوب السؤال ده قبل كده في رسالة سابقة
    // (زي لما يكتب "شيفروليه 2022" الأول، وبعدين "أوبترا" لوحدها، فالبوت ينسى السنة ويسأل عليها تاني).
    // الرد العام لـ looksConfused ("لسه مستني ردّك") مش مناسب هنا لأنه بيوحي إن المستخدم لسه مجاوبش خالص،
    // فده بيزوّد الإحباط بدل ما يوضّح. بدل كده بنعتذر ونوضّح إن المعلومة دي محتاجة تتكرر في نفس الرسالة.
    const looksLikeAlreadyTold = /قلتلك|قلت لك|قلته لك|قلتها|إنت مسمعتش|مش سامعني/.test(n0);
    if(looksLikeAlreadyTold && !looksLikeCancel && !looksLikeOtherIntent){
      const pending = flow.type==='loan' ? LOAN_STEPS[flow.step].ask : PRICE_STEPS[flow.step].ask;
      return `معلش، مقدرتش ألقط الإجابة دي في رسالة قبل كده. تحب تكتبها تاني هنا لوحدها؟ اللي محتاجه بالظبط: "${pending}"`;
    }
    if(looksConfused && !looksLikeCancel && !looksLikeOtherIntent){
      const pending = flow.type==='loan' ? LOAN_STEPS[flow.step].ask : PRICE_STEPS[flow.step].ask;
      return `أنا لسه مستني ردّك على السؤال ده: "${pending}" — لو عايز تلغي الموضوع، قولّي "بلاش".`;
    }
    if(looksLikeCancel || looksLikeOtherIntent){
      flow = null;
      if(looksLikeCancel) return 'تمام، سيبنا الموضوع ده. اسألني في أي حاجة تانية.';
    }
  }
  // active multi-turn flow takes priority
  if(flow && flow.type==='loan') return handleLoanStep(text);
  if(flow && flow.type==='price') return handlePriceStep(text);

  // كلام عام (تحية/شكر/سؤال عن الإمكانيات) — رد سريع من غير ما يدخل في منطق الموديلات
  const smallTalk = checkSmallTalk(text);
  if(smallTalk) return smallTalk;

  // لو كتب "المصادر" كنص عادي بدل ما يضغط الزرار تحت آخر رد فيه مصادر
  if(/مصادر|روابط الاعلانات|لينكات/.test(normalize(text))){
    if(lastSources && lastSources.length){
      return { text: 'دي روابط المصادر اللي استخدمتها في آخر رد فيه بيانات أسعار:', sources: lastSources };
    }
    return 'لسه معنديش رد فيه مصادر أعرضهالك — اسأل عن سعر موديل وسنة (زي "كورولا 2022")، وهيظهر زرار "🔗 المصادر" تلقائي تحت الرد لو فيه روابط.';
  }

  // "السعر ده كويس ولا لأ؟" — المستخدم عنده رقم معيّن وعايز رأي، مش مجرد استعلام سعر عادي
  const fairness = checkPriceFairness(text);
  if(fairness) return fairness;

  // ذكر موديلين معروفين في نفس الرسالة (زي "كورولا 2022 ولا سيراتو 2022 ايه احسن؟") — نية مقارنة واضحة
  // من غير ما نحتاج كلمة "قارن" صريحة
  const compare = checkCompareModels(text);
  if(compare) return compare;

  // "ايه انسب سيارة في سعر 300 الف" — سؤال مختلف عن "سعر موديل معيّن"، المستخدم مش قاصد موديل بعينه
  // ولازم نتعامل معاه بالبحث في كل الموديلات بدل ما ندخله في فلو "الموديل والماركة ايه؟" ويتوه فيه
  if(isBudgetRecommendationQuery(text)){
    const budgetAnswer = buildBudgetAnswer(text);
    if(budgetAnswer) return budgetAnswer;
  }

  // متابعة غامضة بعد عرض موديلات ماركة معيّنة (زي "اكتر حاجة عندك ايه" بعد ما قلنا موديلات تويوتا)
  const brandExtreme = handleBrandExtremeQuestion(text);
  if(brandExtreme) return brandExtreme;

  // "انصحني بإيه" / "ايه أحسن اختيار" — رفيق مش بس بيعرض أسعار، بيقترح أفضل قيمة لو المستخدم عايز
  if(/انصحن(ي|و)|احسن (اختيار|عربي|سياره)|أفضل (اختيار|عربي|سياره)|توصيني/.test(normalize(text))){
    const m = findKnownModel(text) || lastModel;
    const y = extractYear(text) || lastYear;
    if(!m || !y){
      return 'قولّي الموديل والسنة الأول (زي "كورولا 2022")، وبعدين اسألني "انصحني بإيه" وأديك رأيي في أفضل قيمة من العينة.';
    }
    const listings = getFreshListings(m, y);
    if(!listings || !listings.length){
      return `معنديش إعلانات حقيقية لـ ${m} موديل ${y} أبني عليها اقتراح — البيانات المتاحة دلوقتي تقديرية بس، مش كافية لتوصية موثوقة.`;
    }
    const rec = recommendBest(listings);
    if(!rec) return 'معرفتش أطلع اقتراح واضح من البيانات المتاحة، جرّب تحدد الموديل والسنة تاني.';
    const {best, reasons} = rec;
    return {
      text: `من ${listings.length} إعلان حقيقي لـ ${m} موديل ${y}، رأيي إن أفضل قيمة مقابل السعر هو ده:`,
      card:[
        {headline:true, label:'السعر المقترح', value: fmt(best.price)+' ج.م'},
        ['الكيلومترات', best.km!=null ? fmt(best.km)+' كم' : 'غير محدد'],
        ['الحالة حسب النص', best.note || 'غير مذكورة'],
        ['المصدر', best.source || 'غير محدد'],
      ],
      sources: best.url ? [{label:best.source||'مصدر', url:best.url}] : undefined,
      note: 'ليه ده تحديدًا: ' + reasons.join('، ') + '. ده اقتراح مبدئي من البيانات المتاحة بس — لازم تعاين السيارة بنفسك أو بميكانيكي قبل أي قرار شراء نهائي.'
    };
  }

  // نتأكد الأول إنها مش سؤال إجرائي حتى لو فيها اسم موديل وسنة بالصدفة
  const licEarly = checkLicenseFAQ(text);

  if(!licEarly){
    // كشف مباشر: "كيا سيراتو 2015" في رسالة واحدة → افهم من غير ما تسأل من الأول
    const direct = tryDirectPriceQuery(text);
    if(direct) return direct;

    // متابعة سياقية: "طيب لو 2026" بعد سؤال سعر قبل كده — فيها سنة بس من غير موديل،
    // نفتكر آخر موديل اتكلمنا عليه ونرد فورًا بالتفصيل الكامل، من غير أي سؤال زيادة
    const yOnly = extractYear(text);
    const hasModelWord = findKnownModel(text);
    if(!hasModelWord && yOnly && lastModel){
      return buildPriceAnswer(lastModel, yOnly, extractKm(text));
    }
  }

  const n = normalize(text);
  if(/احسب قسط|عايز احسب قسط/.test(n) || detectTopIntent(text)==='loan') return startLoanFlow();
  if(/سعر عربيتي|تقييم سعر/.test(n) || detectTopIntent(text)==='price') return startPriceFlow();

  const lic = licEarly;
  if(lic) return lic;

  // لو ذكر اسم ماركة بس من غير موديل محدد (زي "عايز تويوتا" أو "عندك كيا ايه")، نقترح موديلاتها المتابعة
  const brandOnly = findBrandOnly(text);
  if(brandOnly && !findKnownModel(text)){
    const models = BRAND_MODELS[brandOnly];
    lastBrand = brandOnly; lastBrandModels = models;
    // لو السنة اتقالت في نفس الرسالة (زي "شيفروليه 2022")، نحفظها ونعترف بيها في الرد
    // بدل ما نرميها ونسأل عليها تاني لما المستخدم يحدد الموديل في رسالة تالية
    const y = extractYear(text);
    if(y){
      pendingYear = y;
      return `من موديلات ${brandOnly} أنا بتابع أسعارها فعليًا: ${models.join('، ')}. قولّي أنهي واحد فيهم وهرد عليك بسعر ${y} على طول.`;
    }
    pendingYear = null;
    return `من موديلات ${brandOnly} أنا بتابع أسعارها فعليًا: ${models.join('، ')}. قولّي أنهي واحد فيهم وسنة كام وهرد عليك بالتفصيل.`;
  }

  // لو ذكر ماركة حقيقية معروفة بس احنا مش بنجمعلها بيانات لسه، نقول كده صراحة بدل رد عام
  const untracked = findUntrackedBrand(text);
  if(untracked){
    return `${untracked} ماركة حقيقية، بس مش من ضمن اللي عندي بيانات أسعار ليها لسه. اسأل عن ماركة تانية، أو قولّي وهسجل طلبك لإضافة ${untracked} قريب.`;
  }

  // فيه سنة واضحة في الرسالة بس مفيش موديل معروف ومفيش آخر موديل نفتكره — نسأل سؤال محدد بدل الرد العام
  // (بدل ما نقول "مش فاهم" وكأننا مسمعناش حاجة خالص، مع إننا فعليًا فهمنا السنة)
  const yDetected = extractYear(text);
  if(yDetected && !findKnownModel(text) && !lastModel){
    return `فاهم إن في سنة ${yDetected}، بس مش عارف الموديل والماركة عن أنهي عربية. قولّي مثلاً "كورولا ${yDetected}" أو "سيراتو ${yDetected}" وهرد عليك فورًا بالتفصيل.`;
  }

  return {
    text:'مش قد فاهم قصدك بالظبط من الرسالة دي. أنا حاليًا كويس في 3 حاجات: حساب قسط شهري، تقييم سعر سيارة (اكتب الموديل والسنة زي "سيراتو 2015")، أو إجراءات ترخيص ونقل ملكية. جرّب تصيغ سؤالك بأي واحدة من دول وهرد عليك أدق.',
  };
}

function ask(text){
  if(!text.trim()) return;
  addRow('user', text);
  input.value = '';
  sendBtn.disabled = true;
  const typing = addTyping();
  setTimeout(()=>{
    typing.remove();
    const result = respondTo(toWesternDigits(text));
    addRow('bot', result);
    sendBtn.disabled = false;
    input.focus();
  }, 380 + Math.random()*350);
}

// ⚠️ إيميل حساب جوجل المسموحله يدخل لوحة التحكم كأدمن. ده بس تحكم في الواجهة (يخفي اللوحة عن
// أي حد تاني)، مش حماية حقيقية — لازم تتأكد إن نفس الإيميل ده مكتوب في قواعد أمان Firestore
// (request.auth.token.email) وإلا أي حساب جوجل هيقدر يكتب على البيانات مباشرة حتى لو مش شايف اللوحة.
const ADMIN_EMAIL = "Mahmoudabdelaalaboalsaoud@gmail.com";

let firebaseApp = null, fbAuth = null, fbDb = null, firebaseReady = false;

const ADMIN_STORAGE_KEY = 'rafiq_real_listings_v1'; // كاش محلي احتياطي لو Firestore مش متاح

// تحميل بيانات الإعلانات بترتيب أولوية: 1) لايف من Firestore (لو الاتصال شغال) 2) كاش محلي
// محفوظ من قبل لو Firestore مش متاح دلوقتي 3) النسخة المكتوبة جوه الكود كخط دفاع أخير — بالشكل
// ده الشات بيفضل شغال حتى من غير نت أو لو فايربيس فيه مشكلة، وبياخد أحدث بيانات لما يبقى متاح.
// REAL_LISTINGS متعرّفة بـ const فمينفعش نستبدل المتغير نفسه، فبنمسح خصائصها القديمة ونحطّ
// النسخة الجديدة مكانها — كل الدوال التانية بترجع لنفس المتغير فهتشوف التحديث فورًا.
function applyListingsData(data){
  for(const k in REAL_LISTINGS) delete REAL_LISTINGS[k];
  Object.assign(REAL_LISTINGS, data);
}
async function loadListingsFromFirestore(){
  if(!firebaseReady) return false;
  try{
    const snap = await fbDb.collection('listings').get();
    if(snap.empty) return false; // فايربيس شغال بس لسه مفيش بيانات متحمّلة عليه (أول مرة)
    const data = {};
    snap.forEach(doc => { data[doc.id] = doc.data(); });
    applyListingsData(data);
    try{ localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(data)); }catch(e){}
    return true;
  }catch(e){
    console.error('تعذر تحميل البيانات من Firestore، هنجرّب الكاش المحلي', e);
    return false;
  }
}
function loadListingsFromLocalCache(){
  try{
    const saved = localStorage.getItem(ADMIN_STORAGE_KEY);
    if(!saved) return false;
    applyListingsData(JSON.parse(saved));
    return true;
  }catch(e){ return false; }
}
// بنبدأ بمحاولة Firestore في الخلفية (async) من غير ما نأخّر عرض الشات — لو الرسالة الأولى
// جت قبل ما الطلب يخلص، هترد من النسخة المكتوبة جوه الكود، وده أفضل بكتير من شاشة تحميل فاضية
(async function initListingsData(){
  const gotLive = await loadListingsFromFirestore();
  if(!gotLive) loadListingsFromLocalCache();
})();

// بيتصل بـ Firestore ويحفظ مستند موديل واحد بس (بكل سنينه) — أرخص وأسرع من إعادة كتابة
// كل البيانات في كل حفظة، ومناسب لطريقة عمل اللوحة (بتشتغل على موديل واحد في المرة)
async function saveModelToFirestore(model){
  if(!firebaseReady) return false;
  try{
    await fbDb.collection('listings').doc(model).set(REAL_LISTINGS[model] || {});
    return true;
  }catch(e){
    adminStatus('تعذر الحفظ على Firestore: ' + e.message, true);
    return false;
  }
}
function saveLocalCache(){
  try{ localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(REAL_LISTINGS)); }catch(e){}
}

// اللوحة بتقرا وتكتب على نفس البيانات اللي الشات بيرد منها بالظبط

  currentUser = user;

function adminPopulateBrands(){
  adminBrandSelect.innerHTML = '<option value="">اختر الماركة</option>';
  Object.keys(BRAND_MODELS).sort((a,b)=>a.localeCompare(b,'ar')).forEach(brand=>{
    const opt = document.createElement('option');
    opt.value = brand; opt.textContent = brand;
    adminBrandSelect.appendChild(opt);
  });
  adminModelSelect.innerHTML = '<option value="">اختر الموديل</option>';
  adminModelSelect.disabled = true;
  adminYearSelect.innerHTML = '<option value="">اختر السنة</option>';
  adminYearSelect.disabled = true;
  adminNewYearInput.classList.add('hidden');
  adminNewYearConfirm.classList.add('hidden');
  adminCurrentModel = null; adminCurrentYear = null;
  adminRenderListings();
}

adminBrandSelect.addEventListener('change', ()=>{
  const brand = adminBrandSelect.value;
  adminModelSelect.innerHTML = '<option value="">اختر الموديل</option>';
  adminYearSelect.innerHTML = '<option value="">اختر السنة</option>';
  adminYearSelect.disabled = true;
  adminNewYearInput.classList.add('hidden');
  adminNewYearConfirm.classList.add('hidden');
  adminCurrentModel = null; adminCurrentYear = null;
  adminRenderListings();
  if(!brand){ adminModelSelect.disabled = true; return; }
  const models = BRAND_MODELS[brand] || [];
  const seen = new Set();
  models.forEach(displayName=>{
    const key = adminResolveModelKey(displayName);
    if(seen.has(key)) return;
    seen.add(key);
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = key;
    adminModelSelect.appendChild(opt);
  });
  adminModelSelect.disabled = false;
});

adminModelSelect.addEventListener('change', ()=>{
  const model = adminModelSelect.value;
  adminCurrentModel = model || null;
  adminCurrentYear = null;
  adminYearSelect.innerHTML = '<option value="">اختر السنة</option>';
  adminNewYearInput.classList.add('hidden');
  adminNewYearConfirm.classList.add('hidden');
  adminRenderListings();
  if(!model){ adminYearSelect.disabled = true; return; }
  // ملحوظة: منعمدش نعمل REAL_LISTINGS[model] = {} هنا مجرد لاختيار الموديل في القايمة — عشان
  // مجرد تصفح موديل من غير إضافة أي بيانات فعلية ميسجّلش مفتاح فاضي دايم في البيانات
