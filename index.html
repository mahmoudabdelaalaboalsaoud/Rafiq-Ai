  adminCurrentYear = y;
  adminDirty = true;
  adminRenderListings();
});

function adminField(labelText, value, onInput, full){
  const wrap = document.createElement('div');
  wrap.className = 'admin-field' + (full ? ' full' : '');
  const label = document.createElement('label');
  label.textContent = labelText;
  const inputEl = document.createElement('input');
  inputEl.value = value==null ? '' : value;
  inputEl.addEventListener('input', ()=>{ onInput(inputEl.value); adminDirty = true; });
  wrap.appendChild(label); wrap.appendChild(inputEl);
  return {wrap, inputEl};
}

function adminBuildRow(listing, idx){
  const row = document.createElement('div');
  const refreshFreshness = () => {
    const fresh = isListingFresh(listing, 60);
    row.className = 'admin-row' + (fresh ? '' : ' is-stale');
    freshBadge.textContent = fresh ? 'طازج' : 'قديم (+60 يوم)';
    freshBadge.className = 'admin-freshness ' + (fresh ? 'fresh' : 'stale');
  };

  row.appendChild(adminField('السعر (جنيه)', listing.price, v=>{ listing.price = Number(v)||0; }).wrap);
  row.appendChild(adminField('الكيلومترات', listing.km, v=>{ listing.km = v===''?null:Number(v); }).wrap);
  row.appendChild(adminField('المصدر', listing.source, v=>{ listing.source = v; }).wrap);
  row.appendChild(adminField('رابط الإعلان', listing.url, v=>{ listing.url = v; }, true).wrap);
  row.appendChild(adminField('الملاحظة (الفئة/الدهان/التفاصيل)', listing.note, v=>{ listing.note = v; }, true).wrap);
  row.appendChild(adminField('التاريخ (YYYY-MM-DD أو نص حر)', listing.date, v=>{ listing.date = v; refreshFreshness(); }, true).wrap);

  const footer = document.createElement('div');
  footer.className = 'admin-row-footer';
  const freshBadge = document.createElement('span');
  const delBtn = document.createElement('button');
  delBtn.className = 'admin-del-btn';
  delBtn.textContent = '🗑️ حذف';
  delBtn.addEventListener('click', ()=>{
    REAL_LISTINGS[adminCurrentModel][adminCurrentYear].splice(idx, 1);
    adminDirty = true;
    adminRenderListings();
  });
  footer.appendChild(freshBadge);
  footer.appendChild(delBtn);
  row.appendChild(footer);
  refreshFreshness();

  return row;
}

function adminRenderListings(){
  adminListingsArea.innerHTML = '';
  if(!adminCurrentModel || !adminCurrentYear){
    const hint = document.createElement('div');
    hint.className = 'admin-empty-hint';
    hint.textContent = 'اختر الماركة والموديل والسنة عشان تشوف وتعدّل الإعلانات.';
    adminListingsArea.appendChild(hint);
    adminActionsBar.classList.add('hidden');
    return;
  }
  adminActionsBar.classList.remove('hidden');
  const arr = REAL_LISTINGS[adminCurrentModel][adminCurrentYear] || [];
  if(!arr.length){
    const hint = document.createElement('div');
    hint.className = 'admin-empty-hint';
    hint.textContent = 'مفيش إعلانات مسجّلة هنا لسه. دوس "إضافة إعلان جديد".';
    adminListingsArea.appendChild(hint);
  }
  arr.forEach((listing, idx)=> adminListingsArea.appendChild(adminBuildRow(listing, idx)));
}

adminAddRowBtn.addEventListener('click', ()=>{
  if(!adminCurrentModel || !adminCurrentYear){ adminStatus('اختر الموديل والسنة الأول', true); return; }
  if(!REAL_LISTINGS[adminCurrentModel][adminCurrentYear]) REAL_LISTINGS[adminCurrentModel][adminCurrentYear] = [];
  REAL_LISTINGS[adminCurrentModel][adminCurrentYear].push({price:0, km:null, source:'', note:'', url:'', date:''});
  adminDirty = true;
  adminRenderListings();
});

adminCleanYearBtn.addEventListener('click', async ()=>{
  if(!adminCurrentModel || !adminCurrentYear) return;
  const arr = REAL_LISTINGS[adminCurrentModel][adminCurrentYear];
  const removed = arr.filter(l=>!isListingFresh(l,60)).length;
  if(!removed){ adminStatus('مفيش إعلانات قديمة هنا.'); return; }
  if(!confirm(`هيتم حذف ${removed} إعلان عدّى عليهم أكتر من 60 يوم من ${adminCurrentModel} ${adminCurrentYear}، وهيتحفظ فورًا على Firestore. متأكد؟`)) return;
  REAL_LISTINGS[adminCurrentModel][adminCurrentYear] = arr.filter(l=>isListingFresh(l,60));
  adminRenderListings();
  const ok = await saveModelToFirestore(adminCurrentModel);
  saveLocalCache();
  adminStatus(ok ? `اتحذف ${removed} إعلان قديم واتحفظ على Firestore ✓` : `اتحذف محليًا بس فايربيس مش متاح دلوقتي.`, !ok);
});

adminCleanAllBtn.addEventListener('click', async ()=>{
  let totalRemoved = 0;
  const affectedModels = [];
  for(const model in REAL_LISTINGS){
    for(const year in REAL_LISTINGS[model]){
      const n = REAL_LISTINGS[model][year].filter(l=>!isListingFresh(l,60)).length;
      if(n>0){ totalRemoved += n; if(!affectedModels.includes(model)) affectedModels.push(model); }
    }
  }
  if(!totalRemoved){ adminStatus('مفيش أي إعلان قديم في كل التطبيق.'); return; }
  if(!confirm(`هيتم حذف ${totalRemoved} إعلان في ${affectedModels.length} موديل عدّى عليهم أكتر من 60 يوم، وهيتحفظ فورًا على Firestore. متأكد؟`)) return;
  for(const model of affectedModels){
    for(const year in REAL_LISTINGS[model]){
      REAL_LISTINGS[model][year] = REAL_LISTINGS[model][year].filter(l=>isListingFresh(l,60));
    }
  }
  adminStatus('بيحفظ التنظيف على Firestore...');
  for(const model of affectedModels){ await saveModelToFirestore(model); }
  saveLocalCache();
  adminRenderListings();
  adminStatus(`اتحذف ${totalRemoved} إعلان قديم من ${affectedModels.length} موديل، واتحفظ على Firestore ✓`);
});

adminSaveBtn.addEventListener('click', async ()=>{
  if(!adminCurrentModel){ adminStatus('اختر موديل الأول', true); return; }
  adminStatus('بيحفظ...');
  const ok = await saveModelToFirestore(adminCurrentModel);
  saveLocalCache();
  if(ok){
    adminDirty = false;
    adminStatus(`اتحفظ "${adminCurrentModel}" بنجاح على Firestore ✓ — هيظهر لكل زوار الشات.`);
  } else {
    adminStatus('اتحفظ في الكاش المحلي بس (فايربيس مش متاح دلوقتي)، جرّب تاني لما النت يرجع.', true);
  }
});

// رفع أولي: بيبعت كل موديل موجود في REAL_LISTINGS دلوقتي (سواء النسخة المكتوبة جوه الكود، أو
// نسخة مستوردة من JSON) كمستند مستقل في مجموعة "listings" على Firestore. مستخدَم مرة واحدة
// أول ما تربط قاعدة البيانات، أو بعد ما تستورد نسخة احتياطية كاملة وعايز تنشرها لكل الزوار.
adminUploadFirestoreBtn.addEventListener('click', async ()=>{
  if(!firebaseReady){ adminStatus('Firebase مش شغال — تأكد من بيانات الإعداد.', true); return; }
  const models = Object.keys(REAL_LISTINGS);
  if(!confirm(`هيتم رفع ${models.length} موديل على Firestore، وده هيستبدل أي بيانات موجودة هناك بنفس الاسم. متأكد؟`)) return;
  adminStatus(`بيرفع 0/${models.length}...`);
  let done = 0;
  for(const model of models){
    await saveModelToFirestore(model);
    done++;
    adminStatus(`بيرفع ${done}/${models.length}...`);
  }
  adminStatus(`اترفع ${models.length} موديل على Firestore بنجاح ✓`);
});

adminExportBtn.addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(REAL_LISTINGS, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rafiq-listings-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

adminImportInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('هيتم استبدال كل بيانات الإعلانات الحالية بالنسخة المستوردة دي. متأكد؟')) return;
      for(const k in REAL_LISTINGS) delete REAL_LISTINGS[k];
      Object.assign(REAL_LISTINGS, parsed);
      adminDirty = true;
      adminPopulateBrands();
      adminStatus('اتستوردت النسخة الاحتياطية بنجاح ✓ — دوس "حفظ التعديلات" عشان تثبّتها.');
    }catch(err){
      adminStatus('ملف غير صالح: ' + err.message, true);
    }
  };
  reader.readAsText(file);
  adminImportInput.value = '';
});
</script>
</body>
</html>
